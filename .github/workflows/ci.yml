# CI for tre v2. The main `test` job is Linux-only, deliberately; §14
# step 7 (this one, wiring `accesskit`) is ARCHITECTURE.md §6's own named
# trigger for adding *minimal* Windows/macOS build+smoke jobs (below),
# since this is the first step where real platform-specific behavior
# (UIA vs. NSAccessibility vs. AT-SPI) becomes load-bearing.
#
# Windows/macOS jobs are deliberately narrower than Linux's: `cargo
# build --workspace --all-targets` is the real, blocking proof (every
# platform-specific accesskit backend -- `accesskit_windows`/
# `accesskit_macos`, pulled in transitively by `accesskit_winit` per
# platform -- at least compiles). `cargo test --workspace` runs too, but
# `continue-on-error: true`: unlike Linux, where `mesa-vulkan-drivers`
# was verified directly to give `wgpu::Instance::request_adapter` a real
# (if software) adapter on a bare runner, this session has no way to
# verify GitHub's Windows/macOS hosted runners have an equivalent
# software GPU adapter (WARP on Windows is likely present; macOS's VM
# Metal support is genuinely unverified from here) -- reporting the
# result without blocking on it is the honest choice until someone
# checks a real run's log.
#
# Headless GPU note: `wgpu::Instance::request_adapter` needs *some*
# adapter to succeed, and GitHub's hosted runners have no real GPU. The
# `mesa-vulkan-drivers` package below installs Mesa's software Vulkan
# implementation (lavapipe), which is enough for every headless
# pixel-readback test in this workspace (`rect_scene_renders_expected_pixels`,
# `animated_color_and_opacity_render_the_interpolated_value_mid_flight`,
# `layout_tree`, `text_layout`) to get a real adapter and render
# correctly -- just not at real-GPU speed. Those tests use `.expect(...)`
# on `request_adapter`, not the graceful-exit pattern reserved for
# actually-optional hardware/display absence (TRE v1 finding #261) --
# if lavapipe is missing, they should fail loudly, not skip silently.
#
# `libfontconfig1-dev`: `parley`'s `fontique` backend links against
# fontconfig's `pkg-config` file on Linux at *compile* time regardless of
# whether it's used at runtime -- `TextRenderer` disables system font
# discovery (`CollectionOptions { system_fonts: false, .. }`), but that's
# a runtime choice, not a conditional compile, so the crate still needs
# to build. Found by a real first CI run failing on this exact package
# (`yeslogic-fontconfig-sys`'s build script), not by guessing ahead of
# time -- this machine's own dev environment already had it installed,
# which is exactly the kind of gap a bare CI runner exists to catch.
#
# `tests/rect_window.rs` (a real winit window) needs a real display and
# doesn't get one here -- no Xvfb is installed. This is fine, not a gap:
# `engine-platform::run_windowed` returns `Err` when `EventLoop::new()`
# can't reach a display, and the test's own `main()` already treats that
# as an expected, non-exceptional exit (the same finding #261 convention),
# so it exits 0 having exercised none of its GPU/render code. The real
# proof for that test's pipeline is the headless tests above; this test
# only additionally proves "presents to a real OS window," which a
# developer verifies locally (see its own module doc comment).
#
# Python smoke test (§14 step 6): ARCHITECTURE.md §13's own "Decision
# recorded" -- primary-OS CI for the Python bindings starts as soon as
# `engine-py` exists (this step), not deferred until the API stabilizes.
# `maturin develop` + `import tre` + the real pytest suite + every
# `examples/*.py` (each checks its building block headlessly, then opens a
# real window when one's reachable or exits 0 gracefully here via the
# finding #261 convention `App.run()` implements).
name: CI

# Three tiers, picked by tools/ci_plan.py from what the change touches (docs/contributing.md,
# "CI tiers"):
#   docs     only documentation changed: build the site strictly, check the generated API page.
#   partial  code changed (the standard run): the changed crates and every crate that depends on them
#            (clippy and tests), and the Python tests that cover the change. Linux only.
#   full     a release (the workspace version moved), a build-config change (Cargo.lock, the
#            toolchain, the root Cargo.toml, this file), the `full-ci` label, or a manual run:
#            everything, on Linux, Windows and macOS, plus the MSRV check and the examples.
# `CI result` is the one job to look at (or require): it fails if any job that ran failed, and
# passes when the tier's jobs passed and the others were skipped by design.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier to run"
        type: choice
        options: [full, docs]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides the tier. Cheap: git and Python's standard library only.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      reason: ${{ steps.plan.outputs.reason }}
      run_docs: ${{ steps.plan.outputs.run_docs }}
      rust: ${{ steps.plan.outputs.rust }}
      affected_args: ${{ steps.plan.outputs.affected_args }}
      build_ext: ${{ steps.plan.outputs.build_ext }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      pytest_scope: ${{ steps.plan.outputs.pytest_scope }}
      pytest_files: ${{ steps.plan.outputs.pytest_files }}
      examples: ${{ steps.plan.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pick the tier
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TIER: ${{ inputs.tier }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as a merge of its head into the base: the first parent
          # is the base as it is now, so the diff is exactly what the PR changes.
          if [ "$EVENT" = pull_request ]; then BASE=$(git rev-parse HEAD^1); else BASE="$BEFORE"; fi
          python3 tools/ci_plan.py --base "$BASE" --event "$EVENT" --tier "$TIER" --labels "$LABELS" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  # The docs tier, and part of the others whenever a page changed: the site builds strictly, the
  # generated Python API page is current, CLAUDE.md still only imports AGENTS.md, the version agrees.
  docs:
    needs: plan
    if: needs.plan.outputs.run_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - name: Build the site (broken links and nav entries fail it)
        run: mkdocs build --strict
      - name: Check the generated Python API page is current
        run: |
          python tools/gen_python_api.py
          git diff --exit-code -- docs/api/python.md
      - name: Agent instructions and version consistency
        run: |
          python tools/check_agent_docs.py
          python tools/check_version.py

  # The partial tier: the standard run for a code change.
  partial:
    needs: plan
    if: needs.plan.outputs.tier == 'partial'
    runs-on: ubuntu-latest
    env:
      AFFECTED: ${{ needs.plan.outputs.affected_args }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: needs.plan.outputs.rust == 'true' || needs.plan.outputs.build_ext == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libudev-dev \
            libfontconfig1-dev pkg-config mesa-vulkan-drivers libgl1-mesa-dri

      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.plan.outputs.rust == 'true' || needs.plan.outputs.build_ext == 'true'
        run: rustup show

      # Restore only: a partial build is not the whole dependency set, so the full tier saves it.
      - name: Restore cargo registry and build artifacts
        if: needs.plan.outputs.rust == 'true' || needs.plan.outputs.build_ext == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        if: needs.plan.outputs.rust == 'true'
        run: cargo fmt --check

      - name: Clippy on the affected crates
        if: needs.plan.outputs.rust == 'true'
        run: cargo clippy $AFFECTED --all-targets -- -D warnings

      - name: Test the affected crates
        if: needs.plan.outputs.rust == 'true'
        run: cargo test $AFFECTED
        env:
          TRE_DAMAGE_VERIFY: "1"

      - uses: actions/setup-python@v5
        if: needs.plan.outputs.build_ext == 'true' || needs.plan.outputs.typecheck == 'true'
        with:
          python-version: "3.12"
      - name: Create and activate a venv
        if: needs.plan.outputs.build_ext == 'true' || needs.plan.outputs.typecheck == 'true'
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install maturin, pytest, and mypy
        if: needs.plan.outputs.build_ext == 'true' || needs.plan.outputs.typecheck == 'true'
        run: pip install "maturin>=1.7,<2.0" pytest "mypy>=2.3,<3"
      - name: Build and install the tre extension (maturin develop)
        if: needs.plan.outputs.build_ext == 'true' || needs.plan.outputs.typecheck == 'true'
        run: maturin develop
      - name: Import smoke test
        if: needs.plan.outputs.build_ext == 'true' || needs.plan.outputs.typecheck == 'true'
        run: python -c "import tre; print(tre.App, tre.Node)"

      - name: Type-check the package (mypy --strict)
        if: needs.plan.outputs.typecheck == 'true'
        run: mypy --strict python/tre
      - name: Check the stub against the extension (stubtest)
        if: needs.plan.outputs.typecheck == 'true'
        run: python -m mypy.stubtest tre --allowlist tools/stubtest_allowlist.txt
      - name: Check the generated Python API page is current
        if: needs.plan.outputs.typecheck == 'true'
        run: |
          python tools/gen_python_api.py
          git diff --exit-code -- docs/api/python.md

      - name: Python tests (the whole suite)
        if: needs.plan.outputs.pytest_scope == 'all'
        run: python -m pytest tests/ -v
        env:
          TRE_DAMAGE_VERIFY: "1"
      - name: Python tests that cover the change
        if: needs.plan.outputs.pytest_scope == 'selected'
        run: python -m pytest ${{ needs.plan.outputs.pytest_files }} -v
        env:
          TRE_DAMAGE_VERIFY: "1"

      - name: Run the changed examples
        if: needs.plan.outputs.examples != ''
        run: |
          for example in ${{ needs.plan.outputs.examples }}; do
            echo "== $example"
            timeout 120 python "$example"
          done

  # The full tier is the jobs below, as they were: Linux (tests, clippy, fmt, mypy, stubtest, pytest,
  # every example), Windows, macOS and the MSRV. They run only when the plan says `full`.
  # The MSRV the root Cargo.toml's `rust-version` states, enforced: the
  # whole workspace must still build on it.
  msrv:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libudev-dev \
            libfontconfig1-dev pkg-config
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.90 --profile minimal
      - name: Check the workspace on the MSRV
        run: cargo +1.90 check --workspace --all-targets

  test:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # winit's X11+Wayland build deps, plus Mesa's software Vulkan ICD
      # for headless wgpu (see the file header comment above).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libudev-dev \
            libfontconfig1-dev pkg-config mesa-vulkan-drivers libgl1-mesa-dri

      # rustup on the runner reads rust-toolchain.toml automatically on
      # the first `cargo`/`rustc` invocation below -- no explicit
      # toolchain-install action needed. `rustup show` here just forces
      # that install to happen up front, with its own visible log output,
      # rather than silently inside the first real build step.
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Restore cargo registry and build artifacts
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace
        env:
          # 0.5.4 (#125): the damage walk that visits only changed nodes also
          # runs the full walk and panics if they disagree.
          TRE_DAMAGE_VERIFY: "1"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      # Informational, not blocking: the 16.6ms/8.3ms budget (§6 Locked
      # Decisions) is a claim about real-GPU steady-state performance.
      # lavapipe's software rasterizer is not that -- a runner-to-runner
      # timing swing here reflects noisy-neighbor CPU scheduling on
      # shared CI hardware, not a real regression, so this can't be a
      # hard merge gate until real GPU runners are available. It still
      # runs every push so a wildly-off number is visible, just not
      # merge-blocking.
      - name: Frame-time benchmark (release, informational -- software-rendered, not real-GPU)
        continue-on-error: true
        run: cargo test -p engine-render --test frame_budget --release -- --ignored --nocapture

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `maturin develop` refuses to run outside an active virtualenv/
      # conda env ("Couldn't find a virtualenv or conda environment") --
      # a real first-run CI failure, not predicted in advance: every
      # local verification this session used its own `.venv`, which
      # masked this. `actions/setup-python` alone doesn't create or
      # activate one, so every later step in this job runs with `.venv`
      # explicitly on PATH (matching what `source .venv/bin/activate`
      # does, since GitHub Actions steps don't share a persisted shell
      # session across `run:` blocks).
      - name: Create and activate a venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install maturin, pytest, and mypy
        run: pip install "maturin>=1.7,<2.0" pytest "mypy>=2.3,<3"

      - name: Build and install the tre extension (maturin develop)
        run: maturin develop

      - name: Import smoke test
        run: python -c "import tre; print(tre.App, tre.Node)"

      # 0.4.3 M19: the stub against itself, then against the built
      # extension -- the docs audit found `Node.get(property=)` in the stub
      # where the runtime takes `name`, which `mypy` alone accepted.
      - name: Type-check the package (mypy --strict)
        run: mypy --strict python/tre

      - name: Check the stub against the extension (stubtest)
        run: python -m mypy.stubtest tre --allowlist tools/stubtest_allowlist.txt

      # 0.5.4 (review): docs/api/python.md is generated from the built
      # extension and committed; an API change without regenerating it fails
      # here instead of drifting. (docs/api/rust.md needs rustdoc JSON from a
      # nightly toolchain, which this job does not install; it is checked by hand.)
      - name: Check the generated Python API page is current
        run: |
          python tools/gen_python_api.py
          git diff --exit-code -- docs/api/python.md

      - name: Python FFI test suite
        run: python -m pytest tests/ -v
        env:
          TRE_DAMAGE_VERIFY: "1"

      - name: Run every example
        run: |
          for example in examples/*.py; do
            echo "== $example"
            timeout 120 python "$example"
          done

      # 0.4.4 M22: the cache holds the dependencies only -- the workspace's
      # own crates rebuild in under a minute, and a trimmed cache (452 MB on
      # Windows) saves in seconds, where the whole build folder had grown
      # past 3 GB. It's keyed exactly, with no restore-keys: a new
      # Cargo.lock builds cold once rather than carrying the last lock's
      # output into the next save, which is how it grew.
      - name: Trim the cache to the dependencies
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo clean -p engine-core -p engine-render -p engine-platform -p engine-py
          cargo clean --release -p engine-core -p engine-render -p engine-platform -p engine-py
          rm -rf target/debug/incremental target/release/incremental target/maturin
      # Saved as its own step, not actions/cache's post-job hook, so it can
      # time out: on 0.4.2's release PR the Windows job's upload hung for
      # over 8 minutes after every test had passed. A timeout or failure
      # here only skips saving the cache; it never fails the job. As
      # before, it saves only on an exact-key miss and a successful job.
      - name: Save cargo registry and build artifacts
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # §14 step 7's own trigger (see file header comment) -- minimal,
  # compile-focused, not the full Linux job's breadth (no Python/maturin,
  # no clippy/fmt, no frame-time benchmark: those stay Linux-only checks,
  # not per-platform ones).
  test-windows:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Restore cargo registry and build artifacts
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Test workspace (informational -- see file header comment)
        continue-on-error: true
        run: cargo test --workspace
      # 0.4.4 M22: the cache holds the dependencies only -- the workspace's
      # own crates rebuild in under a minute, and a trimmed cache (452 MB on
      # Windows) saves in seconds, where the whole build folder had grown
      # past 3 GB. It's keyed exactly, with no restore-keys: a new
      # Cargo.lock builds cold once rather than carrying the last lock's
      # output into the next save, which is how it grew.
      - name: Trim the cache to the dependencies
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo clean -p engine-core -p engine-render -p engine-platform -p engine-py
          cargo clean --release -p engine-core -p engine-render -p engine-platform -p engine-py
          rm -rf target/debug/incremental target/release/incremental target/maturin
      # Saved as its own step, not actions/cache's post-job hook, so it can
      # time out: on 0.4.2's release PR the Windows job's upload hung for
      # over 8 minutes after every test had passed. A timeout or failure
      # here only skips saving the cache; it never fails the job. As
      # before, it saves only on an exact-key miss and a successful job.
      - name: Save cargo registry and build artifacts
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test-macos:
    needs: plan
    if: needs.plan.outputs.tier == 'full'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Restore cargo registry and build artifacts
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Test workspace (informational -- see file header comment)
        continue-on-error: true
        run: cargo test --workspace
      # 0.4.4 M22: the cache holds the dependencies only -- the workspace's
      # own crates rebuild in under a minute, and a trimmed cache (452 MB on
      # Windows) saves in seconds, where the whole build folder had grown
      # past 3 GB. It's keyed exactly, with no restore-keys: a new
      # Cargo.lock builds cold once rather than carrying the last lock's
      # output into the next save, which is how it grew.
      - name: Trim the cache to the dependencies
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo clean -p engine-core -p engine-render -p engine-platform -p engine-py
          cargo clean --release -p engine-core -p engine-render -p engine-platform -p engine-py
          rm -rf target/debug/incremental target/release/incremental target/maturin
      # Saved as its own step, not actions/cache's post-job hook, so it can
      # time out: on 0.4.2's release PR the Windows job's upload hung for
      # over 8 minutes after every test had passed. A timeout or failure
      # here only skips saving the cache; it never fails the job. As
      # before, it saves only on an exact-key miss and a successful job.
      - name: Save cargo registry and build artifacts
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # One verdict for the whole workflow. A job the tier does not use is skipped, which is fine;
  # one that ran and failed (or was cancelled) is not.
  result:
    name: CI result
    if: always()
    needs: [plan, docs, partial, msrv, test, test-windows, test-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job that ran
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.plan.outputs.tier }}
          REASON: ${{ needs.plan.outputs.reason }}
        run: |
          echo "tier: $TIER ($REASON)"
          echo "$NEEDS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] in ("failure", "cancelled")}
          for name, result in bad.items():
              print(f"{name}: {result}")
          sys.exit(1 if bad else 0)
          '
