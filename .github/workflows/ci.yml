name: CI

# "Every commit": both direct pushes and pull request commits.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # TECHNICAL.md Section 9.2: clippy with -D warnings is the hard gate;
      # clippy::pedantic on tre-engine/tre-math is enabled in their own
      # Cargo.toml [lints.clippy], so this one command covers both.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo build --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: cargo test --workspace
