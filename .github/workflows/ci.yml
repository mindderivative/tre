name: CI

# "Every commit": both direct pushes and pull request commits.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # Two dependencies neither hosted runner image provides by default:
      # tre-platform's wayland-client dependency uses the "system" feature
      # (a real libwayland-client.so, not the pure-Rust backend), located
      # via pkg-config -- libwayland-dev provides the .pc file and the
      # library. tre-rhi-vulkan's build.rs shells out to glslc to compile
      # its placeholder shaders (TECHNICAL.md Section 9.3). Discovered
      # 2026-09-05: both had been missing since the crates that need them
      # were added, and every job that compiles the workspace had been
      # silently failing on CI for three commits without anyone noticing
      # (see documentation/REVIEW.md's Phase 2 Step 2 entry).
      #
      # Phase 4 Step 4.1: libfontconfig1-dev is `tre-text`'s `fontconfig`
      # crate's own build-time requirement (links the system
      # libfontconfig, per that crate's own documented dependency).
      # fonts-dejavu-core/fonts-noto-core/fonts-noto-color-emoji make
      # `tre-text`'s fallback-cascade tests' real, by-name font lookups
      # ("DejaVu Sans", "Noto Sans", "Noto Color Emoji") resolve
      # deterministically on this hosted runner, not just on a developer's
      # own already-font-rich machine.
      #
      # Phase 14 Step 14.4 added `tray-icon`/`gtk` as a direct
      # `tre-platform` dependency (tray icon + native menu) -- since
      # `tre-platform` is itself a dependency of nearly every crate/
      # example in the workspace, this silently broke every job in this
      # file that builds or runs anything touching it (clippy/build/
      # test/vulkan-validation/accessibility-validation), starting with
      # that commit, for the identical reason this comment block's own
      # note above describes for libwayland-dev/glslc: the crates that
      # needed `libgtk-3-dev`/`libayatana-appindicator3-dev` were added
      # without updating this workflow's own package list, and nobody
      # checked the resulting CI runs -- confirmed by reading back
      # several pushes' worth of run logs, all failing at the identical
      # `glib-sys`/`libappindicator-sys` build-script pkg-config error
      # (`Package glib-2.0 was not found`), not the accessibility-
      # validation job's own already-disclosed, unrelated finding below.
      # `libgtk-3-dev` alone provides glib-2.0.pc transitively (plus
      # cairo/pango/gdk-pixbuf/atk, `gdk-sys`'s/`pango-sys`'s/etc. own
      # real requirements); `libappindicator-sys` 0.9.0 probes
      # `ayatana-appindicator3-0.1` first, which `libayatana-
      # appindicator3-dev` provides on Ubuntu 24.04 (the legacy
      # `libappindicator3-dev` package this crate's own fallback name
      # expects is not present in this runner's repos). `libdbus-1-dev`
      # is NOT needed: `tre-a11y` binds AT-SPI2 via `zbus`, a pure-Rust
      # D-Bus implementation with no system `libdbus` link requirement
      # at all -- confirmed via Cargo.lock, not assumed.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxcb1-dev glslc libfontconfig1-dev \
            fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
            libgtk-3-dev libayatana-appindicator3-dev
      # TECHNICAL.md Section 9.2: clippy with -D warnings is the hard gate;
      # clippy::pedantic on tre-engine/tre-math is enabled in their own
      # Cargo.toml [lints.clippy], so this one command covers both.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # REVIEW.md finding #248: the one job that does NOT run `rustup show`.
  # Every other job installs `rust-toolchain.toml`'s pinned development
  # toolchain (1.98.0 today), which is exactly how the workspace's declared
  # `rust-version` went unverified -- and false -- for weeks (finding #247:
  # `1.75` failed on the first lint `reason` attribute; the lockfile itself
  # needed 1.88). This job reads the floor straight out of `Cargo.toml`,
  # installs that toolchain explicitly, and checks every target against
  # the committed `Cargo.lock` (`--locked`: a dependency whose own MSRV
  # exceeds the floor fails here, rather than being silently re-resolved).
  # `cargo check`, not `build`: the goal is "compiles at the floor," and
  # `check` still runs every `build.rs` (glslc, shaderc, fontconfig), so
  # the same system packages the other jobs need are needed here too.
  msrv:
    name: msrv (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Read the declared floor from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -nE 's/^rust-version = "([0-9.]+)"$/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "declared rust-version: $msrv"
      - run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxcb1-dev glslc libfontconfig1-dev \
            fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
            libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # See the clippy job's own comment above for why libgtk-3-dev/
      # libayatana-appindicator3-dev are needed here too (Phase 14 Step
      # 14.4's tray-icon dependency, silently missing from this workflow
      # since that commit).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxcb1-dev glslc libfontconfig1-dev \
            fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
            libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo build --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # Phase 5 Step 5.3.2: `tre-a11y`'s round-trip test proves a real
      # AT-SPI2/D-Bus query against what it published, so it needs a
      # real accessibility bus to run against -- `dbus-user-session`
      # provides `dbus-run-session` (a private, throwaway session bus per
      # invocation, the same "headless CI is missing what a real desktop
      # already provides" gap `xvfb-run`/the software Vulkan ICD already
      # exist to close for GPU testing below); `at-spi2-core` installs
      # `org.a11y.Bus`'s own D-Bus service-activation file, so
      # `dbus-run-session` auto-starts the real `at-spi-bus-launcher`/
      # `at-spi2-registryd` pair on first query, the same standard
      # mechanism a real desktop session or a Flatpak sandbox relies on
      # -- no manual daemon orchestration needed. The test itself skips
      # gracefully (not a failure) if this environment ever doesn't
      # provide a reachable bus, so this is real coverage, not a new
      # single point of CI failure.
      # See the clippy job's own comment above for why libgtk-3-dev/
      # libayatana-appindicator3-dev are needed here too. libxkbcommon-
      # x11-0 is a second, separate, previously undisclosed gap: winit's
      # own X11 backend dlopen()s libxkbcommon-x11.so.0 at runtime (not
      # link time), confirmed present since Phase 11 Step 11.1's winit
      # migration (2026-09-10) -- one day before the tray-icon build
      # break above, so every job that actually RUNS a compiled binary
      # touching a window (this one included, plus vulkan-validation/
      # accessibility-validation below) has been panicking with "Library
      # libxkbcommon-x11.so could not be loaded" since that commit,
      # confirmed by reading that same day's own CI run log directly.
      # xvfb-run wraps `cargo test` here for the identical reason
      # vulkan-validation/accessibility-validation already wrap their
      # own example runs: tre-platform's own real clipboard/tray unit
      # tests (Phase 14) need a real X11 display and a real GTK init to
      # succeed, and this job never provided one.
      #
      # REVIEW.md finding #217: `libvulkan1`/`mesa-vulkan-drivers`/
      # `vulkan-validationlayers` were missing here even though
      # `tre-ffi`'s own C harness test (`cargo test -p tre-ffi`, part of
      # `cargo test --workspace` below) is a real GPU test needing an
      # actual Vulkan device -- this hosted runner has none, so a
      # software ICD is required, exactly like `vulkan-validation`/
      # `accessibility-validation` below already install for their own
      # example runs. Added here to close that gap for real, matching
      # those two jobs' own package set exactly rather than a smaller
      # ad hoc subset.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxcb1-dev glslc libfontconfig1-dev \
            fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
            dbus-user-session at-spi2-core \
            libgtk-3-dev libayatana-appindicator3-dev xvfb libxkbcommon-x11-0 \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
      # Real finding from this workflow's own first two live runs (Step
      # 5.3.3's own CI follow-up, 2026-09-08): a freshly D-Bus-activated
      # at-spi2-registryd on this runner consistently takes ~10.05s
      # before our app is actually discoverable in its registry --
      # identical whether or not org.a11y.Status.IsEnabled is explicitly
      # forced true beforehand (tried and directly disproved: two
      # separate runs both measured ~10.05s regardless), so that was
      # never the real bottleneck. tre-a11y's own round-trip test now
      # polls for 30s instead of 10s -- real, evidence-based margin over
      # both observed worst cases, not a blind guess.
      - run: xvfb-run -a dbus-run-session -- cargo test --workspace
      # Phase 4 Step 4.2.2: no GPU/Vulkan involved at all -- MSDF
      # generation is pure CPU, so this runs as a plain example here
      # rather than in the vulkan-validation job below.
      - run: cargo run -p tre-text --example msdf_generation_demo
      # Phase 9 Step 9.2: TECHNICAL.md Section 9.2's own criterion-based
      # CPU frame-processing regression gate -- pure CPU (RenderingCanvas
      # record + flatten), same reasoning as msdf_generation_demo above
      # for belonging here, not vulkan-validation.
      #
      # REVIEW.md finding #227: this used to be a hard *absolute*
      # 0.50ms budget, calibrated on the project owner's own local dev
      # hardware. A real CI run measured the exact same, already-optimized
      # code at ~1.8x that local figure; re-running the identical code on
      # CI five times back-to-back (no code changes) found a *tight*
      # cluster (1.7% coefficient of variation) at that same ~1.8x-slower
      # level, ruling out shared-runner noise as the explanation -- CI's
      # own hosted runner is just reliably slower than local hardware for
      # this workload, not noisy. An absolute budget calibrated on one
      # machine can never hold on another machine with a different,
      # stable performance ratio, so the gate is redesigned here as a
      # relative check against a CI-hardware-calibrated baseline
      # (crates/tre-engine/benches/frame_processing_ci_baseline.json)
      # within a tolerance -- confirmed with the project owner.
      - run: cargo bench -p tre-engine --bench frame_processing
      - name: Check frame_processing bench against its CI baseline (TECHNICAL.md Section 9.2)
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open(
              "target/criterion/record_and_flatten_10k_nodes/new/estimates.json"
          ) as f:
              data = json.load(f)
          mean_ns = data["mean"]["point_estimate"]

          with open(
              "crates/tre-engine/benches/frame_processing_ci_baseline.json"
          ) as f:
              baseline = json.load(f)
          baseline_ns = baseline["baseline_ns"]
          tolerance_pct = baseline["tolerance_pct"]
          ceiling_ns = baseline_ns * (1 + tolerance_pct / 100)

          print(
              f"record_and_flatten_10k_nodes: {mean_ns:.0f} ns "
              f"(CI baseline: {baseline_ns} ns, +{tolerance_pct}% ceiling: {ceiling_ns:.0f} ns)"
          )
          if mean_ns > ceiling_ns:
              print(
                  f"FAIL: {mean_ns:.0f} ns exceeds the CI baseline's +{tolerance_pct}% ceiling "
                  f"of {ceiling_ns:.0f} ns (TECHNICAL.md Section 9.2, REVIEW.md finding #227) -- "
                  "if this is a genuine, intentional performance change, re-establish the "
                  "baseline in frame_processing_ci_baseline.json against several fresh CI runs, "
                  "not just this one"
              )
              sys.exit(1)
          PY

  # REVIEW.md finding #254 (2026-09-13, at the project owner's direction):
  # the first job anywhere in CI that builds or runs the `tre_python`
  # extension. Until this job existed, every Python-facing change was
  # verified only by a human running `maturin develop` and the
  # `demo/*/demo.py` scripts locally -- findings #249-#253's five
  # dependency bumps included (30 demos, all local). This job builds the
  # real wheel the way `docs/getting-started.md` tells a user to (maturin,
  # from `crates/tre-python/Cargo.toml` directly -- there is no pyproject),
  # installs it into the runner's own Python, and runs every demo script
  # as its own self-asserting end-to-end test, on the same software Vulkan
  # ICD + Xvfb + fonts recipe the `vulkan-validation` job already proved
  # on these runners, inside a throwaway D-Bus session (the accessibility
  # demo needs a real AT-SPI2 bus, the same one `accessibility-validation`
  # uses) with the `toolkit-accessibility` key set the way that job found
  # actually works. Not `vulkan-validationlayers`: the wheel is a
  # `--release` build, which never requests the validation layer (only
  # debug builds do), so installing it here would just be dead weight.
  python:
    name: python (tre_python wheel + every demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # Same list as `accessibility-validation` minus the validation
      # layer (see the job comment above); `libxkbcommon-x11-0` for the
      # windowed demos (see the `test` job's own account of that gap).
      # The runner's OWN Python (Ubuntu 24.04 ships 3.12), in a venv --
      # NOT `actions/setup-python`. The first real run of this job (REVIEW.md
      # finding #254) used the toolcache Python, which exports
      # `LD_LIBRARY_PATH=/opt/hostedtoolcache/Python/.../lib` into every
      # later step, and inside that process every Vulkan demo died with
      # winit's `XKBNotFound` (libxkbcommon failed to dlopen) and both tray
      # demos segfaulted after GLib reported `GdkDisplayManager` already
      # registered (two GTK/GObject copies in one process) -- while the
      # neighbouring Rust example jobs, same packages, same Xvfb, no
      # foreign library path, pass. A wheel built against the distro's own
      # Python is also what `docs/getting-started.md` actually tells a Linux
      # user to build.
      - name: Install a software Vulkan ICD, a virtual display, D-Bus + AT-SPI2, real fonts, and the system Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers xvfb x11-utils libwayland-dev libxcb1-dev glslc \
            libfontconfig1-dev fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
            dbus dbus-user-session at-spi2-core dconf-cli openbox \
            libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-x11-0 \
            python3 python3-venv python3-dev
      - name: Create a venv on the system Python and put it first on PATH for every later step
        run: |
          python3 -m venv .ci-venv
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
          .ci-venv/bin/python --version
      # `openbox`: a bare Xvfb has no window manager, and on X11 a newly
      # mapped window only ever receives keyboard focus from one (winit's
      # own `focus_window` is a `_NET_ACTIVE_WINDOW` request to the WM,
      # too). `demo/phase19_step19_4` asserts a real
      # `WindowFocused(focused=True)` event on creation, so that ONE demo
      # runs with a minimal WM started inside its own Xvfb (`focusNew` is
      # openbox's default). Scoped to that demo, not applied to every
      # windowed one: a WM also decorates, places, and may resize windows,
      # which the other demos never asked for and were not rehearsed with.
      # `pillow` is the one third-party import across all 30 demos
      # (`demo/phase17_step17_1` reads back the PNGs `TrayIcon.set_icon`
      # writes); everything else is the standard library plus `tre_python`.
      - run: python -m pip install --upgrade pip maturin pillow
      - name: Build the tre_python wheel (release, no abi3 -- tied to this exact Python minor)
        run: maturin build --release -m crates/tre-python/Cargo.toml -o dist -i python
      - run: python -m pip install dist/*.whl
      # `demo/phase18_step18_3` spawns this exact debug example binary as
      # its independent AT-SPI2 client (its own error message names this
      # command); building it up front keeps the demo's runtime clean.
      - run: cargo build -p tre-rhi-vulkan --example canvas_accessibility_single_process_check_verify
      # `accessibility-validation`'s own hard-won recipe (REVIEW.md
      # finding #126): `org.a11y.Status.IsEnabled` is read once, at
      # `at-spi-bus-launcher` startup, straight from this GSettings key.
      - name: Enable accessibility via the toolkit-accessibility GSettings key
        run: dbus-run-session -- dconf write /org/gnome/desktop/interface/toolkit-accessibility true
      # Cheap, read-only evidence printed BEFORE the demos run, so a failure
      # in the next step can be diagnosed from this log instead of from a
      # theory: which interpreter, any inherited library-path override,
      # where the loader resolves xkbcommon/GTK/GObject, what the extension
      # actually links, and whether the Xvfb display has the XKEYBOARD
      # extension winit's X11 backend requires.
      - name: Environment evidence for the demos
        run: |
          echo "python: $(command -v python) ($(python --version))"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<unset>}"
          ldconfig -p | grep -E 'libxkbcommon|libgdk-3|libgtk-3|libgobject-2' || true
          python -c 'import tre_python, os; print("extension:", tre_python.__file__)'
          ldd "$(python -c 'import tre_python; print(tre_python.__file__)')" | grep -E 'xkb|gdk|gtk|gobject|glib|vulkan|fontconfig' || true
          xvfb-run -a sh -c 'xdpyinfo | grep -iE "vendor string|XKEYBOARD|version number"' || true
      # One step, every demo, each under its own timeout and its own
      # fresh session bus + virtual display, with a per-demo PASS/FAIL
      # line and a final summary -- so a single failing demo is named in
      # the log rather than hiding a dozen others behind a fail-fast.
      # Skipped, with the reason stated where it is skipped:
      #   phase14_step14_3 -- its check 3 asserts a native "Open File"
      #   dialog is STILL blocking after a real two-second wait, which is
      #   only true when a live XDG desktop portal is present to show
      #   one; with no portal the call returns immediately and the
      #   assertion's own premise is gone, not the code under test.
      - name: Run every demo/*/demo.py against the installed wheel
        run: |
          set -u
          skip="phase14_step14_3"
          needs_wm="phase19_step19_4"
          # $1 = demo script, $2 = "wm" to start openbox inside the demo's
          # own Xvfb first. The inner `sh -c` receives the script path as
          # a positional argument ($1 there), never via string splicing.
          # openbox signals readiness itself (`--startup CMD` runs CMD once
          # it is up) rather than the demo trusting a fixed sleep: on a
          # loaded runner, after 28 software-rendered demos, a 1 s sleep
          # was observed to lose the race once -- the window mapped before
          # the WM existed, so nothing ever granted it focus.
          run_demo() {
            if [ "$2" = wm ]; then
              dbus-run-session -- xvfb-run -a sh -c '
                ready=$(mktemp -u)
                openbox --sm-disable --startup "touch $ready" >/dev/null 2>&1 &
                for _ in $(seq 100); do [ -e "$ready" ] && break; sleep 0.1; done
                [ -e "$ready" ] || echo "warning: openbox never signalled readiness within 10 s"
                exec timeout 600 python "$1"' sh "$1"
            else
              dbus-run-session -- xvfb-run -a timeout 600 python "$1"
            fi
          }
          pass=0; fail=0; skipped=0; failed_names=""
          for script in demo/*/demo.py; do
            name=$(basename "$(dirname "$script")")
            case " $skip " in *" $name "*) echo "SKIP $name (needs a live XDG desktop portal)"; skipped=$((skipped+1)); continue;; esac
            wm=""; case " $needs_wm " in *" $name "*) wm=wm;; esac
            echo "::group::$name"
            if run_demo "$script" "$wm"; then
              echo "PASS $name"; pass=$((pass+1))
            else
              echo "FAIL $name (exit $?)"; fail=$((fail+1)); failed_names="$failed_names $name"
            fi
            echo "::endgroup::"
          done
          echo "=== python demos: pass=$pass fail=$fail skipped=$skipped ==="
          if [ "$fail" -ne 0 ]; then echo "failed:$failed_names"; exit 1; fi

  vulkan-validation:
    name: vulkan-validation
    runs-on: ubuntu-latest
    # IMPLEMENTATION.md Step 2.4: debug builds request
    # VK_LAYER_KHRONOS_validation automatically (tre-rhi-vulkan's
    # VulkanDevice::new) and abort() on any error-severity message. This
    # job just needs a software Vulkan driver (no GPU on hosted runners),
    # the validation layer itself, and a virtual display (tre-platform's
    # X11 fallback, since there's no Wayland here either) actually
    # installed, so every example genuinely exercises that gate instead of
    # only ever being checked manually by a human running it locally.
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # See the clippy job's own comment above for why libgtk-3-dev/
      # libayatana-appindicator3-dev are needed here too -- every
      # example below depends on tre-platform for its window/surface.
      # libxkbcommon-x11-0 is a separate, previously undisclosed gap of
      # its own -- see the test job's own comment for the full account
      # (present since Phase 11 Step 11.1's winit migration, a day
      # before the tray-icon gap above).
      - name: Install a software Vulkan ICD, validation layers, a virtual display, libwayland-dev, and real fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb libwayland-dev libxcb1-dev glslc \
            libfontconfig1-dev fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
            libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-x11-0
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example walking_skeleton
        env:
          TRE_WALKING_SKELETON_FRAMES: 10
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example multi_window
        env:
          TRE_MULTI_WINDOW_FRAMES: 10
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example headless
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example input_demo
        env:
          TRE_INPUT_DEMO_FRAMES: 10
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example memory_pools_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example bindless_textures_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example gc_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example sdf_rounded_rect_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example svg_tessellation_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example svg_morph_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example self_intersecting_fill_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example text_shaping_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example atlas_packing_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example msdf_rendering_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example atlas_concurrency_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example atlas_eviction_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_state_stack_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_draw_text_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_batch_flattening_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_sub_canvas_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example render_to_texture_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_layer_composite_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example layer_oversize_regression_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example layer_blur_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_combined_scene_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example linear_color_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example main_loop_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example dual_kawase_nonbindless_experiment
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example dual_kawase_blur_demo
      # Phase 9 Step 9.1: real GPU proof that flatten()'s batching merge
      # step is pixel-equivalent to the same scene left unbatched.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example batching_equivalence_demo
      # Phase 10 Step 10.1: real GPU proof that ShapeRegistry's retained-
      # mode flattening pass is pixel-equivalent to the same scene drawn
      # directly through today's immediate-mode draw_rounded_rect.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example shape_registry_demo
      # Phase 10 Step 10.2: real GPU proof of full shape rendering support
      # -- a non-uniform-corner bordered Rectangle and a bordered partial-
      # arc Circle, both through ShapeRegistry, with real pixel-level
      # correctness assertions (sharp vs. rounded corners, border vs.
      # fill, the arc sweep's own excluded wedge).
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example shape_full_rendering_demo
      # Phase 10 Step 10.2 follow-up: real GPU proof of lyon-backed Path
      # fill (a compound shape with a real hole) and Path/Polygon
      # border/stroke rendering, both through ShapeRegistry.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example path_and_polygon_demo
      # REVIEW.md finding #164: real GPU proof that walking_skeleton.frag
      # (PipelineKind::FlatColor, Polygon/Path fill and stroke's own
      # shader) now premultiplies its output by alpha -- a translucent
      # flat fill's blended color must match a real, independent
      # premultiplied-alpha reference, not the old, unfixed math.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example translucent_flat_fill_demo
      # Phase 10 Step 10.2.1: real GPU proof of gradient fill (linear +
      # radial) for Rectangle/Circle (the per-vertex style-buffer path)
      # and Polygon (the separate GradientFill pipeline), each probed
      # pixel checked against an independent Rust reference of the exact
      # gradient math.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example gradient_fill_demo
      # Phase 10 Step 10.2.2: real GPU proof of texture fill for all four
      # shape kinds -- Rectangle/Circle sampling a bindless texture
      # directly inside their own SDF shaders, Polygon/Path reusing the
      # existing TexturedQuad pipeline with real bounding-box-normalized
      # UVs, each probed against a known four-quadrant flag texture.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example texture_fill_demo
      # Phase 10 Step 10.2.3: real GPU proof of non-Normal BlendMode
      # rendering (Multiply/Screen/Overlay/SoftLight/ColorDodge) for
      # Polygon/Path solid fill, via VK_KHR_dynamic_rendering_local_read
      # (VK_EXT_blend_operation_advanced, this step's original plan, is
      # not implemented by RADV -- see documentation/REVIEW.md) -- a real
      # subpassLoad framebuffer read against a real input-attachment
      # descriptor, each swatch's own center pixel checked against an
      # independent Rust reference of the exact W3C blend formula.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example blend_mode_demo
      # Phase 10 Step 10.2.4: real GPU proof of the exact ellipse SDF
      # (Inigo Quilez's Newton-Raphson refinement, replacing the old
      # "scaled circle" approximation) -- the first real render of a
      # genuinely non-circular ellipse, its border/fill transition
      # checked at several angles against an independent CPU reference.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example ellipse_sdf_fidelity_demo
      # Phase 10 Step 10.2.5: real GPU proof of rounded stroke caps at a
      # partial arc's own two cut angles (a real circle-SDF union at
      # each cut, radius border_thickness/2) -- pixels a few degrees
      # past each cut confirmed border-colored (the rounding) while
      # pixels further past stay correctly excluded (the rounding is
      # bounded, not a removed cutoff).
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example arc_rounded_cap_demo
      # Phase 10 Step 10.2.6: real, self-checking proof that
      # ShapeRegistry/RenderingCanvas-driven rendering is genuinely
      # zero-allocation in steady state (tre_memory::RenderTickGuard/
      # DebugAllocGuard) -- 120 frames of a real, mutating, mixed scene
      # covering every new fill/blend feature from Steps 10.2.1-10.2.5.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example shape_registry_zero_alloc_demo
      # A real user-stated requirement, GPU-verified: resizing a window
      # must never squash/stretch already-placed content -- an
      # absolutely-positioned shape's own pixel position/size must stay
      # fixed regardless of framebuffer size. See this example's own
      # header doc comment and REVIEW.md finding #233.
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example resize_invariance_demo

  accessibility-validation:
    name: accessibility-validation
    runs-on: ubuntu-latest
    # Phase 5 Step 5.3.3's own real CI investigation (2026-09-08, full
    # account across eighteen real pushes in REVIEW.md finding #126 --
    # kept there rather than duplicated here, since most of it is a
    # record of real, disproven-in-turn hypotheses, not the current
    # config). The short version: `org.a11y.Status.IsEnabled` is a
    # plain, boring GSettings-backed property in the actually-installed
    # at-spi2-core 2.52.0 (Ubuntu 24.04, confirmed via
    # packages.ubuntu.com) -- initialized once at `at-spi-bus-launcher`
    # startup directly from `org.gnome.desktop.interface`'s
    # `toolkit-accessibility` key, no dynamic per-client mechanism
    # involved at all. Most of this investigation (REVIEW.md's seventh
    # through eleventh corrections) chased a real-looking
    # `RegisterEvent`/`EventListenerRegistered` mechanism that turned
    # out to be a `main`-branch-only addition, confirmed absent from the
    # exact 2.52.0 tag's own real source once directly diffed (twelfth
    # correction) -- every individual fact gathered chasing it was real
    # (the signal genuinely fires, the launcher genuinely stays alive),
    # the mechanism connecting those facts to `IsEnabled` was just the
    # wrong one, because it isn't the code running here.
    #
    # The real fix: set that GSettings key true, via `dconf`, before the
    # a11y bus is ever first activated -- exactly what
    # `at-spi-bus-launcher`'s own actually-installed source reads. Tried
    # for real (eighteenth push): the write demonstrably took (an
    # independent `dconf read`, same session, confirmed `true`), but a
    # later, separate session's `canvas_accessibility_verify` still saw
    # `IsEnabled` false (REVIEW.md's thirteenth correction) -- three live
    # explanations not yet disambiguated: the write not persisting to a
    # later fresh session; something else blocking `IsEnabled` besides
    # this GSettings key; or our own `.unwrap_or(false)` masking a real
    # D-Bus error as a false reading. The step below checks both values
    # independently (`dconf`, `dbus-send`) inside a session shaped
    # exactly like the verify step's own, before trying anything else.
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # See the clippy job's own comment above for why libgtk-3-dev/
      # libayatana-appindicator3-dev are needed here too, and the test
      # job's own comment for libxkbcommon-x11-0.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb libwayland-dev libxcb1-dev glslc \
            libfontconfig1-dev fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
            dbus dbus-user-session at-spi2-core dconf-cli \
            libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-x11-0
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_accessibility_demo
      - name: Enable accessibility via the real toolkit-accessibility GSettings key
        run: |
          dbus-run-session -- bash -c '
            echo "=== org.gnome.desktop.interface toolkit-accessibility, before (blank means unset -- schema default applies) ==="
            dconf read /org/gnome/desktop/interface/toolkit-accessibility
            dconf write /org/gnome/desktop/interface/toolkit-accessibility true
            echo "=== org.gnome.desktop.interface toolkit-accessibility, after ==="
            dconf read /org/gnome/desktop/interface/toolkit-accessibility
          '
      - name: Independently check, in a fresh session, whether the write actually took and IsEnabled reflects it (no fix attempted here)
        run: |
          dbus-run-session -- bash -c '
            echo "=== toolkit-accessibility, read fresh in a brand-new session, independent of the write session ==="
            dconf read /org/gnome/desktop/interface/toolkit-accessibility
            echo "=== activating org.a11y.Bus in this fresh session, the same way canvas_accessibility_verify will ==="
            dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus org.a11y.Bus.GetAddress
            echo "=== org.a11y.Status.IsEnabled, read directly via dbus-send -- independent of our own Rust code entirely ==="
            dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus org.freedesktop.DBus.Properties.Get string:org.a11y.Status string:IsEnabled
          '
      - run: dbus-run-session -- cargo run -p tre-rhi-vulkan --example canvas_accessibility_verify
