name: CI

# "Every commit": both direct pushes and pull request commits.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # Two dependencies neither hosted runner image provides by default:
      # tre-platform's wayland-client dependency uses the "system" feature
      # (a real libwayland-client.so, not the pure-Rust backend), located
      # via pkg-config -- libwayland-dev provides the .pc file and the
      # library. tre-rhi-vulkan's build.rs shells out to glslc to compile
      # its placeholder shaders (TECHNICAL.md Section 9.3). Discovered
      # 2026-09-05: both had been missing since the crates that need them
      # were added, and every job that compiles the workspace had been
      # silently failing on CI for three commits without anyone noticing
      # (see documentation/REVIEW.md's Phase 2 Step 2 entry).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libxcb1-dev glslc
      # TECHNICAL.md Section 9.2: clippy with -D warnings is the hard gate;
      # clippy::pedantic on tre-engine/tre-math is enabled in their own
      # Cargo.toml [lints.clippy], so this one command covers both.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libxcb1-dev glslc
      - run: cargo build --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libxcb1-dev glslc
      - run: cargo test --workspace

  vulkan-validation:
    name: vulkan-validation
    runs-on: ubuntu-latest
    # IMPLEMENTATION.md Step 2.4: debug builds request
    # VK_LAYER_KHRONOS_validation automatically (tre-rhi-vulkan's
    # VulkanDevice::new) and abort() on any error-severity message. This
    # job just needs a software Vulkan driver (no GPU on hosted runners),
    # the validation layer itself, and a virtual display (tre-platform's
    # X11 fallback, since there's no Wayland here either) actually
    # installed, so every example genuinely exercises that gate instead of
    # only ever being checked manually by a human running it locally.
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - name: Install a software Vulkan ICD, validation layers, a virtual display, and libwayland-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb libwayland-dev libxcb1-dev glslc
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example walking_skeleton
        env:
          TRE_WALKING_SKELETON_FRAMES: 10
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example multi_window
        env:
          TRE_MULTI_WINDOW_FRAMES: 10
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example headless
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example input_demo
        env:
          TRE_INPUT_DEMO_FRAMES: 10
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example memory_pools_demo
