name: CI

# "Every commit": both direct pushes and pull request commits.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # Two dependencies neither hosted runner image provides by default:
      # tre-platform's wayland-client dependency uses the "system" feature
      # (a real libwayland-client.so, not the pure-Rust backend), located
      # via pkg-config -- libwayland-dev provides the .pc file and the
      # library. tre-rhi-vulkan's build.rs shells out to glslc to compile
      # its placeholder shaders (TECHNICAL.md Section 9.3). Discovered
      # 2026-09-05: both had been missing since the crates that need them
      # were added, and every job that compiles the workspace had been
      # silently failing on CI for three commits without anyone noticing
      # (see documentation/REVIEW.md's Phase 2 Step 2 entry).
      #
      # Phase 4 Step 4.1: libfontconfig1-dev is `tre-text`'s `fontconfig`
      # crate's own build-time requirement (links the system
      # libfontconfig, per that crate's own documented dependency).
      # fonts-dejavu-core/fonts-noto-core/fonts-noto-color-emoji make
      # `tre-text`'s fallback-cascade tests' real, by-name font lookups
      # ("DejaVu Sans", "Noto Sans", "Noto Color Emoji") resolve
      # deterministically on this hosted runner, not just on a developer's
      # own already-font-rich machine.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxcb1-dev glslc libfontconfig1-dev \
            fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji
      # TECHNICAL.md Section 9.2: clippy with -D warnings is the hard gate;
      # clippy::pedantic on tre-engine/tre-math is enabled in their own
      # Cargo.toml [lints.clippy], so this one command covers both.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxcb1-dev glslc libfontconfig1-dev \
            fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji
      - run: cargo build --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # Phase 5 Step 5.3.2: `tre-a11y`'s round-trip test proves a real
      # AT-SPI2/D-Bus query against what it published, so it needs a
      # real accessibility bus to run against -- `dbus-user-session`
      # provides `dbus-run-session` (a private, throwaway session bus per
      # invocation, the same "headless CI is missing what a real desktop
      # already provides" gap `xvfb-run`/the software Vulkan ICD already
      # exist to close for GPU testing below); `at-spi2-core` installs
      # `org.a11y.Bus`'s own D-Bus service-activation file, so
      # `dbus-run-session` auto-starts the real `at-spi-bus-launcher`/
      # `at-spi2-registryd` pair on first query, the same standard
      # mechanism a real desktop session or a Flatpak sandbox relies on
      # -- no manual daemon orchestration needed. The test itself skips
      # gracefully (not a failure) if this environment ever doesn't
      # provide a reachable bus, so this is real coverage, not a new
      # single point of CI failure.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxcb1-dev glslc libfontconfig1-dev \
            fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
            dbus-user-session at-spi2-core
      # Real finding from this workflow's own first two live runs (Step
      # 5.3.3's own CI follow-up, 2026-09-08): a freshly D-Bus-activated
      # at-spi2-registryd on this runner consistently takes ~10.05s
      # before our app is actually discoverable in its registry --
      # identical whether or not org.a11y.Status.IsEnabled is explicitly
      # forced true beforehand (tried and directly disproved: two
      # separate runs both measured ~10.05s regardless), so that was
      # never the real bottleneck. tre-a11y's own round-trip test now
      # polls for 30s instead of 10s -- real, evidence-based margin over
      # both observed worst cases, not a blind guess.
      - run: dbus-run-session -- cargo test --workspace
      # Phase 4 Step 4.2.2: no GPU/Vulkan involved at all -- MSDF
      # generation is pure CPU, so this runs as a plain example here
      # rather than in the vulkan-validation job below.
      - run: cargo run -p tre-text --example msdf_generation_demo

  vulkan-validation:
    name: vulkan-validation
    runs-on: ubuntu-latest
    # IMPLEMENTATION.md Step 2.4: debug builds request
    # VK_LAYER_KHRONOS_validation automatically (tre-rhi-vulkan's
    # VulkanDevice::new) and abort() on any error-severity message. This
    # job just needs a software Vulkan driver (no GPU on hosted runners),
    # the validation layer itself, and a virtual display (tre-platform's
    # X11 fallback, since there's no Wayland here either) actually
    # installed, so every example genuinely exercises that gate instead of
    # only ever being checked manually by a human running it locally.
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - name: Install a software Vulkan ICD, validation layers, a virtual display, libwayland-dev, and real fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb libwayland-dev libxcb1-dev glslc \
            libfontconfig1-dev fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example walking_skeleton
        env:
          TRE_WALKING_SKELETON_FRAMES: 10
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example multi_window
        env:
          TRE_MULTI_WINDOW_FRAMES: 10
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example headless
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example input_demo
        env:
          TRE_INPUT_DEMO_FRAMES: 10
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example memory_pools_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example bindless_textures_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example gc_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example sdf_rounded_rect_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example svg_tessellation_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example svg_morph_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example stencil_and_cover_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example text_shaping_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example atlas_packing_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example msdf_rendering_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example atlas_concurrency_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example atlas_eviction_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_state_stack_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_draw_text_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_batch_flattening_demo
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_sub_canvas_demo

  accessibility-validation:
    name: accessibility-validation
    runs-on: ubuntu-latest
    # Phase 5 Step 5.3.3's own real CI investigation (2026-09-08, full
    # account in REVIEW.md finding #126 -- twelve real pushes so far).
    # Real, disproven-in-turn hypotheses: call ordering; `xvfb-run`
    # wrapper nesting; job-level CPU contention; `IsEnabled` forced via
    # `dbus-send`; Vulkan/X11 shared-library linking (the two-process
    # split below was built to test this specifically -- it did NOT fix
    # the real issue, but is kept as a real, independent improvement:
    # `canvas_accessibility_demo` renders/tags only, `canvas_accessibility_verify`
    # -- confirmed via `ldd` to link zero Vulkan/X11/Wayland libraries --
    # does the real AT-SPI2 work). Real upstream research (reading
    # `at-spi2-core`'s own source) found the real mechanism:
    # `org.a11y.Status.IsEnabled` only flips true when `at-spi2-registryd`
    # emits a real `EventListenerRegistered` signal, itself only sent
    # when a client calls `org.a11y.atspi.Registry.RegisterEvent` --
    # confirmed absent from `accesskit_unix`/`accesskit_atspi_common`'s
    # own source. Both real fix attempts based on this (wait longer;
    # retry the call ~150 times over 30s, in case the signal itself was
    # simply lost before a subscriber was ready) still left `IsEnabled`
    # false the entire time.
    #
    # A user-approved diagnostic-only step (no fix attempted) then
    # captured the real D-Bus wire traffic, process list, and live bus
    # connections during a real failing run (REVIEW.md #126, ninth
    # push). Real findings: RegisterEvent/EventListenerRegistered
    # genuinely work on the wire -- at-spi2-registryd answers every one
    # of our ~150 calls -- but at-spi-bus-launcher, though alive and
    # running (confirmed via ps aux, having correctly spawned the a11y
    # bus's own dbus-daemon), never appears as a connected client on
    # that bus at all. Reading at-spi-bus-launcher.c's own real source
    # explains why: exactly one function, ensure_a11y_bus(), ever
    # subscribes to EventListenerRegistered, on a second connection the
    # launcher makes to the bus it just spawned; it runs at most once,
    # triggered here by the very first GetAddress call (its other,
    # eager trigger needs a --launch-immediately flag that D-Bus's own
    # activation never passes); if that one connection attempt fails,
    # the only consequence is a single g_critical log line -- no retry,
    # no crash -- which a purely D-Bus-activated process never surfaces
    # to anything captured so far. This also rules out an earlier
    # gsettings-desktop-schemas theory: a failed schema lookup would
    # g_error()-abort the whole process, contradicting ps aux showing it
    # alive throughout. The one open question -- this same code path
    # passes reliably in the test job's own round-trip test -- means
    # whatever fails here isn't universal to the runner image, only to
    # how it's triggered in this job. The new step below remains
    # diagnostic only: it launches at-spi-bus-launcher directly (so its
    # own stdout/stderr, with G_MESSAGES_DEBUG=all, is finally visible
    # instead of vanishing into D-Bus's own activation plumbing) to
    # capture the one piece of evidence still missing before any further
    # fix is attempted.
    #
    # That capture (twelfth push) logged a clean startup all the way
    # through reading the bus address -- including the dconf/GSettings
    # backend loading successfully, ruling the gsettings-desktop-schemas
    # theory out for good -- then nothing: no g_critical, no success
    # trace, and busctl list again showed no connection, this time with
    # at-spi2-registryd never even activated. That run only checked
    # liveness once, before the self-connect would run, so a late silent
    # death after reading the address couldn't be told apart from a
    # silent no-op. This step now re-checks liveness and captures the
    # real wait exit status immediately before the final busctl list.
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb libwayland-dev libxcb1-dev glslc \
            libfontconfig1-dev fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji \
            dbus dbus-user-session at-spi2-core
      - run: xvfb-run -a cargo run -p tre-rhi-vulkan --example canvas_accessibility_demo
      - name: Dump real AT-SPI2 bus state for diagnosis (no fix attempted here)
        run: |
          dbus-run-session -- bash -c '
            ADDR=$(dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus org.a11y.Bus.GetAddress | tail -1 | sed "s/.*string \"\\(.*\\)\"/\\1/")
            echo "a11y bus address: $ADDR"
            dbus-monitor --address "$ADDR" > /tmp/dbus-monitor.log 2>&1 &
            MONITOR_PID=$!
            sleep 1
            cargo run -p tre-rhi-vulkan --example canvas_accessibility_verify || true
            sleep 1
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
            echo "=== dbus-monitor output (real a11y bus traffic) ==="
            cat /tmp/dbus-monitor.log
            echo "=== ps aux (a11y/spi/dbus processes) ==="
            ps aux | grep -iE "a11y|spi|dbus" | grep -v grep
            echo "=== busctl list on the real a11y bus ==="
            busctl --address "$ADDR" list 2>&1 || true
          '
      - name: Directly capture at-spi-bus-launchers own stderr (no fix attempted here)
        run: |
          dbus-run-session -- bash -c '
            export G_MESSAGES_DEBUG=all
            /usr/libexec/at-spi-bus-launcher --launch-immediately > /tmp/bus-launcher.log 2>&1 &
            LAUNCHER_PID=$!
            sleep 2
            echo "=== at-spi-bus-launcher stdout/stderr, G_MESSAGES_DEBUG=all (before GetAddress) ==="
            cat /tmp/bus-launcher.log
            echo "=== is at-spi-bus-launcher still alive (before GetAddress)? ==="
            ps -p "$LAUNCHER_PID" -o pid,stat,cmd || echo "process $LAUNCHER_PID is no longer running"
            ADDR=$(dbus-send --session --print-reply --dest=org.a11y.Bus /org/a11y/bus org.a11y.Bus.GetAddress | tail -1 | sed "s/.*string \"\\(.*\\)\"/\\1/")
            echo "a11y bus address: $ADDR"
            sleep 1
            echo "=== at-spi-bus-launcher stdout/stderr (after GetAddress) ==="
            cat /tmp/bus-launcher.log
            echo "=== is at-spi-bus-launcher still alive (immediately before busctl list)? ==="
            if ps -p "$LAUNCHER_PID" -o pid,stat,cmd; then
              echo "still alive -- the self-connect produced no visible busctl connection while the process stayed up"
              STILL_ALIVE=1
            else
              echo "already gone -- it exited on its own some time after reading the bus address"
              STILL_ALIVE=0
            fi
            echo "=== busctl list on the real a11y bus (launch-immediately) ==="
            busctl --address "$ADDR" list 2>&1 || true
            if [ "$STILL_ALIVE" = "0" ]; then
              echo "=== real exit status of at-spi-bus-launcher (it already exited on its own, not from us) ==="
              wait "$LAUNCHER_PID"
              echo "wait reported exit code: $?"
            else
              echo "=== killing at-spi-bus-launcher ourselves and reporting the resulting exit status ==="
              kill "$LAUNCHER_PID" 2>/dev/null || true
              wait "$LAUNCHER_PID" 2>/dev/null
              echo "wait reported exit code (after our own kill): $?"
            fi
          '
