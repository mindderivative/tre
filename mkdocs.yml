site_name: Tesserae Engine
site_description: >-
  A GPU-rendered retained-mode UI engine for Python, written in Rust --
  the building blocks of a desktop UI.
site_url: https://mindderivative.github.io/tre/
repo_url: https://github.com/mindderivative/tre
repo_name: mindderivative/tre
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Overview: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Guide:
      - Nodes and Layout: guide/nodes-and-layout.md
      - Painting: guide/painting.md
      - Animation: guide/animation.md
      - Events and Input: guide/events-and-input.md
      - Text: guide/text.md
      - Accessibility: guide/accessibility.md
      - Layers: guide/layers.md
      - Threading: guide/threading.md
      - Docking: guide/docking.md
      - Custom Title Bars: guide/custom-title-bars.md
      - Building a Widget: guide/building-a-widget.md
  - Examples: examples.md
  - Python API Reference:
      - Overview: api/python/index.md
      - App: api/python/app.md
      - Window: api/python/window.md
      - Node: api/python/node.md
      - Nodes and Properties: api/python/properties.md
      - Events and Listeners: api/python/events.md
      - Layers: api/python/layers.md
      - Paint, Paths, and Animation: api/python/paint.md
      - Painter: api/python/painter.md
  - Rust Crates: api/rust.md
  - Architecture: architecture.md
  - Migrating:
      - To 0.5.x: migrating-0.5.md
      - To 0.4.x: migrating-0.4.md
      - To 0.3.5: migrating-0.3.5.md
      - To 0.3.3: migrating-0.3.3.md
  - Design:
      - Custom windowing (0.5.0): design/custom-windowing.md
      - WGSL shaders (0.5.1): design/wgsl.md
      - Target API: design/target-api.md
      - Legacy widget reference: design/legacy-widgets.md
      - Legacy widget behavior: design/legacy-behavior.md
      - MD3 handover: design/md3-handover.md
      - Binding and cascade audit: design/binding-cascade-audit.md
  - Contributing: contributing.md

validation:
  anchors: warn
