site_name: tre
site_description: >-
  Python-facing GUI framework backend: Rust-native rendering, layout,
  animation, and accessibility engine with Material Design 3 components.
site_url: https://mindderivative.github.io/tre/
repo_url: https://github.com/mindderivative/tre
repo_name: mindderivative/tre
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Overview: index.md
  - Installation: installation.md
  - Migrating to 0.3.3: migrating-0.3.3.md
  - Getting Started: getting-started.md
  - Guide:
      - Imperative API: guide/imperative-api.md
      - Docking: guide/docking-and-shell.md
      - Canvas & Virtualized Lists: guide/canvas-and-lists.md
      - Accessibility & Fonts: guide/theming-and-accessibility.md
      - Working with Files: guide/working-with-files.md
  - Python API Reference:
      - Overview: api/python/index.md
      - App: api/python/app.md
      - Window: api/python/window.md
      - Node: api/python/node.md
      - Nodes and Properties: api/python/properties.md
      - Events and Listeners: api/python/events.md
      - Layers: api/python/layers.md
      - Paint, Paths, and Animation: api/python/paint.md
      - CanvasContext: api/python/canvas-context.md
  - Rust Crates: api/rust.md
  - Architecture: architecture.md
  - Design:
      - Target API: design/target-api.md
      - Legacy widget reference: design/legacy-widgets.md
      - Legacy widget behavior: design/legacy-behavior.md
      - MD3 handover: design/md3-handover.md
      - Binding and cascade audit: design/binding-cascade-audit.md
  - Contributing: contributing.md
