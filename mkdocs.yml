site_name: Tesserae Engine
site_description: >-
  A GPU-rendered retained-mode UI engine for Python, written in Rust --
  the building blocks of a desktop UI.
site_url: https://mindderivative.github.io/tre/
repo_url: https://github.com/mindderivative/tre
repo_name: mindderivative/tre
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Overview: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Guide:
      - Nodes and Layout: guide/nodes-and-layout.md
      - Painting: guide/painting.md
      - Animation: guide/animation.md
      - Events and Input: guide/events-and-input.md
      - Text: guide/text.md
      - Accessibility: guide/accessibility.md
      - Layers: guide/layers.md
      - Docking: guide/docking.md
      - Threading: guide/threading.md
      - Custom Title Bars: guide/custom-title-bars.md
      - Shaders: guide/shaders.md
      - Building a Widget: guide/building-a-widget.md
  - Examples: examples.md
  - API:
      - Rust API: api/rust.md
      - Python API: api/python.md
  - Reference:
      - App: reference/app.md
      - Window: reference/window.md
      - Node: reference/node.md
      - Node properties: reference/properties.md
      - Paint, paths, and animation: reference/paint.md
      - Events and listeners: reference/events.md
      - Layers: reference/layers.md
      - Painter: reference/painter.md
      - Shader: reference/shader.md
  - Architecture: architecture.md
  - Upgrading:
      - To 0.5.x: migrating-0.5.md
      - To 0.4.x: migrating-0.4.md
      - To 0.3.5: migrating-0.3.5.md
      - To 0.3.3: migrating-0.3.3.md
  - Design:
      - Custom windowing: design/custom-windowing.md
      - WGSL shaders: design/wgsl.md
      - Performance baseline: design/performance-baseline.md
  - Contributing: contributing.md

validation:
  anchors: warn
