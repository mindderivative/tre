[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-render",
    "crates/engine-platform",
    "crates/engine-py",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["Phil Hodgins <philip.a.hodgins@gmail.com>"]
repository = "https://github.com/mindderivative/tre"
homepage = "https://github.com/mindderivative/tre"
# No `rust-version` yet, deliberately -- see PLAN.md M3 Phase 1. Claiming
# an MSRV floor before any real dependency exists to derive it from is
# exactly the mistake LESSONS_LEARNED.md §5 documents (TRE v1's `1.75`
# that was quietly false). Set this once a real dependency's own
# `rust-version` gives something to actually check against, then add the
# enforcing `msrv` CI job in the same commit -- not before.

# Debug builds grew `target/debug` to 462 GB (full debug info in every test
# and example binary, plus the incremental cache). Line tables keep file and
# line numbers in backtraces and panics without the full variable-level
# info, and no incremental cache means a full recompile of each changed
# crate instead of a cache that grows without bound.
[profile.dev]
debug = "line-tables-only"
incremental = false
