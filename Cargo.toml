[workspace]
resolver = "2"
members = [
    "crates/tre-engine",
    "crates/tre-ffi",
    "crates/tre-memory",
    "crates/tre-math",
    "crates/tre-svg",
    "crates/tre-text",
    "crates/tre-atlas",
    "crates/tre-rhi-vulkan",
    "crates/tre-rhi-dx12",
    "crates/tre-rhi-metal",
    "crates/tre-platform",
    "crates/tre-a11y",
    "crates/tre-python",
    "crates/tre-tween",
    "crates/tre-animation",
    "crates/tre-perf-suite",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# REVIEW.md finding #248 (2026-09-13): raised from "1.75" at the project
# owner's direction, after finding #247 proved the old figure false
# (`cargo +1.75.0 check` fails on the first `reason = "..."` lint
# attribute, stable only since 1.81). 1.88 is the real floor of the
# resolved `Cargo.lock` as it stands -- `image 0.25.10` and the `icu_*`
# 2.3 crates each declare `rust-version = 1.88`, and `fdsm 0.8.0`'s own
# `nalgebra ^0.34.1` requirement (MSRV 1.87) rules out anything lower
# without downgrading the MSDF generator itself. Verified empirically,
# not inferred: `cargo +1.88.0 check --workspace --all-targets --locked`
# passes. The `msrv` job in `.github/workflows/ci.yml` reads this exact
# value and rebuilds at it on every commit, so the `rust-toolchain.toml`
# pin (the *development* toolchain, a different thing) can never again
# hide a violation the way it hid this one for weeks.
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# REVIEW.md finding #247 (Modernizer lens, 2026-09-13): every external
# dependency shared by two or more member crates is declared exactly once
# here and inherited via `dep.workspace = true` in each member -- the
# same `field.workspace = true` idiom `[workspace.package]` above already
# uses for `version`/`edition`/`rust-version`/`license`. Before this
# table existed, these five were repeated as literal version strings in
# up to five separate manifests each (22 lines total); all happened to be
# identical, but nothing enforced it -- one `cargo add` or hand edit in a
# single crate could silently make two crates disagree on what version of
# `skrifa`/`rustybuzz` counts as "the" font stack (exactly the failure
# `tre-python/Cargo.toml`'s own comment on those two pins warns about).
# Versions and pin styles are carried over unchanged; each member crate's
# own inline rationale for *why* a given version (MSRV ceilings confirmed
# via `cargo add --dry-run`, exact `=` pins) stays where it was, next to
# the crate that first established it. Per-crate `features` still
# compose on top (`tre-engine`'s `bytemuck` `derive`).
[workspace.dependencies]
bytemuck = "1.25.2"
raw-window-handle = "0.6.2"
thiserror = "2.0.20"
skrifa = "=0.33.2"
rustybuzz = "0.20.1"

# TECHNICAL.md Section 9.1: `unsafe_op_in_unsafe_fn` is opt-in (warn-by-default
# only from edition 2024) but the project wants it as a hard error on this
# edition-2021 workspace.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

# REVIEW.md finding #235: a small, surgical patch to `winit`, forked from
# the exact `v0.30.13` tag this workspace already resolved (no unrelated
# upstream changes), adding `WindowExtWayland::set_viewport_source_crop`
# -- crops the `wp_viewport` `winit` already owns and manages for every
# Wayland window (never creates a second one, which is what crashed the
# first, reverted attempt at this: `winit` binds exactly one `wp_viewport`
# per window, unconditionally, with no public API to reach it otherwise).
# Pinned to an exact commit `rev`, not a moving `branch`, matching this
# workspace's own established exact-version-pinning precedent elsewhere
# (`rustc-hash = "=2.1.1"`, `skrifa = "=0.33.2"`) for the identical
# reproducibility reason.
[patch.crates-io]
winit = { git = "https://github.com/mindderivative/winit", rev = "1c2028620ceebb2aa5d132e6a69b57bfbb6d61af" }
