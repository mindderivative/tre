id: root
kind: Container
style: {flex_direction: vertical, width: 240, height: 120, gap: 12, padding: 16}
children:
  - id: label
    kind: Text
    text: {content: "Screen A", font_family: Roboto, font_size: 20}
    style: {width: 200, height: 32, foreground: "#1D1B20"}
  - id: button
    kind: Rect
    style: {width: 120, height: 40, background: "#6750A4", corner_radius: 8}
    handlers: {on_click: "go_to_b"}
