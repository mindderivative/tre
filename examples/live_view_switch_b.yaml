id: root
kind: Container
style: {flex_direction: Vertical, width: 240, height: 120, gap: 12, padding: 16}
children:
  - id: label
    kind: Text
    text: {content: "Screen B", font_family: Roboto, font_size: 20}
    style: {width: 200, height: 32, background: "#FFFFFF00"}
  - id: button
    kind: Rect
    style: {width: 120, height: 40, background: "#03DAC6", corner_radius: 8}
    handlers: {on_click: "go_to_a"}
