id: root
kind: Container
style: {flex_direction: Row, width: 260, height: 40, gap: 8}
children:
  - id: label
    kind: Text
    text: {content: "Count: 0", font_family: Roboto, font_size: 16}
    style: {width: 140, height: 32, background: "#FFFFFF00"}
    bindings: {text: "{{ label.get() }}"}
  - id: button
    kind: Rect
    style: {width: 48, height: 32, background: "#6750A4", corner_radius: 4}
    handlers: {on_click: "bump"}
  - id: remove_button
    kind: Rect
    style: {width: 32, height: 32, background: "#B3261E", corner_radius: 4}
    handlers: {on_click: "remove_self"}
