# M49: a real user-authored custom theme -- overrides the "primary"
# role (reaching both the declarative box below AND the imperative
# add_button, since both resolve colors through the same ColorScheme::
# role chain), and gives Checkbox a larger corner_radius than the
# engine's own shipped default (2.0) -- still beaten by the widget-wide
# stylesheet and any inline style, per the real four-tier cascade.
colors:
  primary: "#00695C"
styles:
  - kind: Checkbox
    style: {corner_radius: 10}
# M50: `components:` overrides the imperative MD3 catalog's own real
# shape/elevation -- a "button.filled" corner radius, reaching every
# add_button(variant="filled") call this window makes, independent of
# `styles:` above (which only ever reaches the 7 declarative NodeKindSpec
# kinds, never window_factory.rs's real MD3 component catalog).
components:
  button.filled: {corner_radius: 4, elevation: 2}
  # M61 (§16.3): corner_radius/elevation also accept a real MD3 shape/
  # elevation *token name* here, resolved through the identical
  # engine_md3::shape::named/elevation_named lookup the declarative
  # StyleSpec path already uses -- an author no longer has to know or
  # re-derive the raw dp number (8.0) for "small," just its real MD3 name.
  card: {corner_radius: small, elevation: level_2}
# M63 (§7.1, §16.3): `typography:` overrides the imperative MD3
# catalog's own centralized type scale (`engine_md3::typography`) by
# real role name -- every `add_button`'s own label resolves its font
# family/weight/size through `ThemeState::typography("label_large")`
# (window_factory.rs), so this override reaches the same button below
# without touching a single literal font constant.
typography:
  label_large: {font_family: Roboto, font_size: 15}
