# M49: a real user-authored custom theme -- overrides the "primary"
# role (reaching both the declarative box below AND the imperative
# add_button, since both resolve colors through the same ColorScheme::
# role chain), and gives Checkbox a larger corner_radius than the
# engine's own shipped default (2.0) -- still beaten by the widget-wide
# stylesheet and any inline style, per the real four-tier cascade.
colors:
  primary: "#00695C"
styles:
  - kind: Checkbox
    style: {corner_radius: 10}
# M50: `components:` overrides the imperative MD3 catalog's own real
# shape/elevation -- a "button.filled" corner radius, reaching every
# add_button(variant="filled") call this window makes, independent of
# `styles:` above (which only ever reaches the 7 declarative NodeKindSpec
# kinds, never window_factory.rs's real MD3 component catalog).
components:
  button.filled: {corner_radius: 4, elevation: 2}
