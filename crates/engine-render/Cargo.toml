[package]
name = "engine-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vello Scene building and GPU rendering. Depends on engine-core (to walk Node/PaintProperties for painting); no winit/engine-platform dependency, only raw-window-handle once windowing is wired. See ARCHITECTURE.md §4, §6."

[dependencies]
engine-core = { path = "../engine-core" }
# vello_hybrid's own low-level glyph type (Scene::glyph_run's `fill_glyphs`
# takes an iterator of these). Already resolved at exactly this version
# transitively via vello_hybrid's own "text" feature -- naming it directly
# adds nothing new to the dependency graph, just lets text.rs construct
# `glifo::Glyph { id, x, y }` values from parley's shaped output.
glifo = "0.3.0"
# Must track peniko's own kurbo requirement exactly (currently "0.13.1",
# checked directly in peniko 0.6.1's Cargo.toml) -- vello_hybrid's
# Scene::fill_path(&BezPath) takes peniko::kurbo's BezPath, not an
# independently-resolved one. They happen to match right now; nothing
# stops a future `cargo update` from drifting them apart silently, since
# Cargo treats "kurbo 0.13.1" and "kurbo 0.13.2" as compatible semver and
# won't warn. Re-verify against peniko's Cargo.toml before bumping either.
kurbo = "0.13.1"
# The shaping half of §14 step 4's typography spike (glifo above is the
# drawing half). Confirmed no kurbo/peniko drift when this was added --
# `grep -c 'name = "kurbo"' Cargo.lock` and the same for peniko both stay
# at 1 -- so the Linebender-family version-coupling risk (§3, already hit
# for real with wgpu in step 1) hasn't bitten here, at least not yet;
# re-check the same way before ever bumping parley independently.
parley = "0.11.1"
peniko = "0.6.1"
raw-window-handle = "0.6.2"
# M22 Phase 1 (§5): the real `ImageSource::from_peniko_image_data`
# conversion (`peniko::ImageData` -> a paintable `vello_common::paint::
# Image`) that `vello_hybrid` itself never re-exports (confirmed via
# grep across its own `lib.rs`) -- a real, necessary direct dependency,
# not an added architectural layer. Pinned to exactly what
# `vello_hybrid` 0.2.0 itself requires (its own Cargo.toml: `vello_common
# = "0.2.0"`), same "zero new resolution, only a direct edge" pattern
# `kurbo`/`parley` above already established -- confirmed via `grep -c
# 'name = "vello_common"' Cargo.lock` staying at 1 after this was added.
# `default-features = false, features = ["std"]` matches `vello_hybrid`'s
# own exact feature set (its Cargo.toml) -- its default `"png"` feature
# (an internal PNG decoder) is deliberately left off, since decoding
# happens through this workspace's own `image` crate instead (in
# `engine-py`), not vello_common's.
vello_common = { version = "0.2.0", default-features = false, features = ["std"] }
# Pinned to exactly what vello_hybrid 0.2.0 itself requires (its own
# Cargo.toml: `wgpu = "29.0.3"`), not the latest wgpu (30.0.1) -- adding
# wgpu independently resolved two incompatible major versions into the
# same dependency graph, which would have failed to compile the moment a
# wgpu::Device created here was passed into a vello_hybrid function
# expecting its own wgpu 29.x type. This is the concrete, no-longer-
# hypothetical form of the Linebender-family version-coupling risk
# ARCHITECTURE.md §3 already flagged -- found by trying to actually build
# this, not by review.
vello_hybrid = { version = "0.2.0", features = ["wgpu", "wgpu_default", "text"] }
wgpu = "29.0.3"

[dev-dependencies]
accesskit = "0.25.0"
engine-platform = { path = "../engine-platform" }
# Test-only, proving §14 step 5's own claim ("rendered through the
# pipeline steps 1-4 already proved"): a real view.yaml, parsed by
# engine-spec, built into a Tree, and rendered through this crate's own
# build_tree_scene/FrameRenderer -- no new real dependency edge, since
# engine-render's own lib.rs never imports engine-spec.
engine-spec = { path = "../engine-spec" }
pollster = "1.0.1"
# Test-only, for docking.rs's DockZone.panels: SmallVec<[NodeId; 4]> --
# already resolved at the same version transitively (engine-core's own
# InteractionState/DockZone use it), zero new dependency-graph cost.
smallvec = "1"
# Test-only: builds taffy::Style values directly for the layout_tree/
# rect_window tests. engine-render's own lib.rs never names taffy --
# it only ever sees the already-computed taffy::Layout via engine-core's
# Tree::layout, matching §4's crate-boundary rule.
taffy = "0.14.0"
winit = "0.30.13"

# Lives in tests/, not examples/, matching TRE v1's own precedent
# (archive/crates/tre-rhi-vulkan) exactly: winit permits constructing an
# EventLoop only on a process's real main thread, and only once per
# process -- a plain #[test] fn runs on a worker thread and would panic.
# harness = false gives it its own process with a real main thread
# instead (§12's already-decided design, TRE v1 finding #261's own
# precedent). Run directly with `cargo test --test rect_window --
# --nocapture` to see it, the same way TRE v1's own demos worked.
[[test]]
name = "rect_window"
harness = false
