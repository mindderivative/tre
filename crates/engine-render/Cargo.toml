[package]
name = "engine-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Vello Scene building and GPU rendering. Depends on engine-core (to walk Node/PaintProperties for painting); no winit/engine-platform dependency: the caller owns the window and its surface. See ARCHITECTURE.md §4, §6."

[dependencies]
engine-core = { path = "../engine-core" }
# `vello_gpu`'s glyph type (`Scene::glyph_run(..).fill_glyphs` takes
# these), from the workspace's pinned commit; text.rs builds
# `glifo::Glyph { id, x, y }` from parley's shaped output.
glifo = { workspace = true }
# Must track peniko's own kurbo requirement exactly (currently "0.13.1",
# checked directly in peniko 0.6.1's Cargo.toml) -- vello_gpu's
# Scene::fill_path(&BezPath) takes peniko::kurbo's BezPath, not an
# independently-resolved one. They happen to match right now; nothing
# stops a future `cargo update` from drifting them apart silently, since
# Cargo treats "kurbo 0.13.1" and "kurbo 0.13.2" as compatible semver and
# won't warn. Re-verify against peniko's Cargo.toml before bumping either.
kurbo = "0.13.1"
# The shaping half of §14 step 4's typography spike (glifo above is the
# drawing half). Confirmed no kurbo/peniko drift when this was added --
# `grep -c 'name = "kurbo"' Cargo.lock` and the same for peniko both stay
# at 1 -- so the Linebender-family version-coupling risk (§3, already hit
# for real with wgpu in step 1) hasn't bitten here, at least not yet;
# re-check the same way before ever bumping parley independently.
parley = "0.11.1"
# Reports a glyph `vello_gpu` couldn't draw (the rest of the run still
# draws); the same `tracing` version `engine-py` installs a subscriber for.
tracing = "0.1.44"
# 0.4.0 M6: the damage fingerprints' hasher -- a fast, fixed-seed,
# non-cryptographic hash (nothing adversarial chooses what's compared),
# already locked here through the workspace's own dependencies.
foldhash = "0.2.0"
slotmap = "1.1.1"
peniko = "0.6.1"
# `ImageSource::from_peniko_image_data` and the geometry types
# `vello_gpu` doesn't re-export; `vello_gpu`, `vello_common`, and `wgpu`
# all come from the workspace table, which pins them together.
vello_common = { workspace = true }
vello_gpu = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
accesskit = "0.25.0"
engine-platform = { path = "../engine-platform" }
pollster = "1.0.1"
# Test-only: builds taffy::Style values directly for the layout_tree/
# rect_window tests. engine-render's own lib.rs never names taffy --
# it only ever sees the already-computed taffy::Layout via engine-core's
# Tree::layout, matching §4's crate-boundary rule.
taffy = "0.14.0"
winit = "0.30.13"

# Lives in tests/, not examples/, matching TRE v1's own precedent
# (archive/crates/tre-rhi-vulkan) exactly: winit permits constructing an
# EventLoop only on a process's real main thread, and only once per
# process -- a plain #[test] fn runs on a worker thread and would panic.
# harness = false gives it its own process with a real main thread
# instead (§12's already-decided design, TRE v1 finding #261's own
# precedent). Run directly with `cargo test --test rect_window --
# --nocapture` to see it, the same way TRE v1's own demos worked.
[[test]]
name = "rect_window"
harness = false
