[package]
name = "tre-rhi-vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ash = "0.38.0"
# Performance review (2026-09-13, REVIEW.md finding #218): TECHNICAL.md
# Section 3.2 already documents TransientPool::free as using FxHashMap
# in place of std::collections::HashMap's default SipHash -- these keys
# are internal, engine-generated values with no untrusted input reaching
# them, so SipHash's DoS resistance buys nothing on this per-push_layer
# hot-path lookup. Pinned exactly to 2.1.1, the newest version `cargo
# add --dry-run` resolves against this workspace's `rust-version = 1.75`
# (2.1.3 needs rustc 1.77) -- an exact `=` pin, matching this crate's own
# `skrifa`/`lyon` precedent for exactly this scenario, since a bare
# `"2.1.1"` range let plain `cargo build` silently resolve 2.1.3 anyway
# (caught only because it happened to build against this machine's own
# newer rustc, not because the pin actually enforced 1.75).
# REVIEW.md finding #248 (2026-09-13): `rust-version` is now 1.88, so
# 2.1.3's own 1.77 requirement no longer binds -- bumpable, and left
# as-is here since the MSRV correction is a separate decision.
rustc-hash = "=2.1.3"
ash-window = "0.13.0"
bytemuck.workspace = true
raw-window-handle.workspace = true
tre-engine = { version = "0.1.0", path = "../tre-engine" }
# Phase 13 Step 13.8: real GLSL fragment-shader compilation at runtime,
# for the custom shader API -- Rust bindings to the identical real
# Google `shaderc` library `build.rs`'s own `glslc` CLI invocation
# already wraps for this crate's compile-time shaders, keeping runtime
# and build-time compilation behavior identical rather than introducing
# a second, potentially-divergent compiler (e.g. `naga`). Confirmed to
# build and link against this machine's pre-installed
# `libshaderc_combined` before adding it here as a real dependency, not
# assumed.
shaderc = "0.8.3"

[dev-dependencies]
png = "0.18.1"
rustybuzz.workspace = true
skrifa.workspace = true
tre-atlas = { path = "../tre-atlas" }
tre-math = { path = "../tre-math" }
# Phase 9 Step 9.2: main_loop_demo.rs's own #[global_allocator] opt-in
# (DebugAllocGuard) and per-frame RenderTickGuard scopes -- dev-only,
# since the zero-allocation debug guard is a testing/enforcement
# primitive, never a production dependency of this crate's own library
# code (which has none).
tre-memory = { path = "../tre-memory" }
tre-platform = { path = "../tre-platform" }
tre-svg = { path = "../tre-svg" }
tre-text = { path = "../tre-text" }
# PLAN_PHASE5_STEP5_3_3.md: canvas_accessibility_demo publishes via a
# real tre-a11y::A11yBridge and re-queries the real AT-SPI2 bus as its
# own second D-Bus client -- zbus pinned to the same version and feature
# set as tre-a11y's own dev-dependency (5.19.0 since REVIEW.md finding
# #252, when `accesskit_unix` itself moved to zbus 5), avoiding a
# second, different zbus major version in the graph.
tre-a11y = { path = "../tre-a11y" }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# implementation begins; TECHNICAL.md Section 2.1, IMPLEMENTATION.md Step 2.1.

# REVIEW.md finding #261: these examples-turned-tests each build a real
# VulkanDevice (via a probe window) and assert exact pixel/behavior
# correctness, so `cargo test -p tre-rhi-vulkan` runs them as real CI
# gates instead of needing ~40 separate `cargo run --example` invocations.
# `harness = false`: each is a self-contained `fn main()` (unchanged from
# its example form) rather than a `#[test]`-per-function libtest binary --
# required because `VulkanDevice::new` needs a `winit` `EventLoop`, which
# winit permits constructing only on a process's real main thread (never
# inside a libtest worker thread, and only once per process, ever). Each
# gracefully skips (exits 0, printing why) if no display server or
# Vulkan-capable device is reachable, matching `tre-a11y/tests/round_trip.
# rs`'s own graceful-skip convention -- so `cargo test` still passes on a
# contributor machine with no GPU.
[[test]]
name = "headless"
harness = false

