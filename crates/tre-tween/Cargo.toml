[package]
name = "tre-tween"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Phase 13 Step 13.2 (Q9): the project's math-library evaluation picked
# `glam` for animation-domain vector math -- the de facto standard,
# SIMD-backed Rust crate for real-time graphics (Bevy/wgpu ecosystem),
# providing the Vec2/Vec3/Quat vocabulary tweening needs. Deliberately
# additive: `tre-math`'s own `Affine2`/SIMD-batch functions stay exactly
# as they are (already proven in `tre-engine`'s hot flatten path) --
# this is a new dependency scoped to the new animation crates, not a
# replacement.
#
# REVIEW.md finding #246: bumped from `0.29` to `0.33.7` -- the newest
# version this workspace's own `rust-version = 1.75` MSRV can resolve,
# confirmed via `cargo add glam@0.33 --dry-run` (glam's own MSRV is
# 1.68.2, well under 1.75, so no conflict at any version up to latest).
# Full workspace build/test clean afterward with no API changes needed
# on this crate's own real usage (`Vec2`/`Vec3`/`Quat` construction and
# basic arithmetic).
glam = "0.33.7"
