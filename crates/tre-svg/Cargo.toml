[package]
name = "tre-svg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Cannot combine `[lints] workspace = true` with additional overrides
# (Cargo rejects it), so the workspace-level lints are restated here
# alongside the extra `clippy::pedantic` this "core rendering crate"
# (TECHNICAL.md Section 9.2) opts into.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
# PLAN_PHASE3_STEP3_3_1.md: SVG DOM/XML parsing and `<use>`/`<g>` reference
# resolution only -- usvg does no rasterization, TRE tessellates and
# renders the geometry it hands back through its own pipeline. Pinned to
# 0.45.1, the newest version this workspace's `rust-version = 1.75` can
# resolve (0.48.1 needs rustc 1.85, confirmed via `cargo add --dry-run`,
# same technique used to pin `wide` in Step 3.1). `default-features =
# false` drops the `text`/`system-fonts`/`memmap-fonts` features (font
# loading, `rustybuzz` text shaping) entirely -- text rendering is Phase
# 4's HarfBuzz integration, a wholly separate concern this crate shouldn't
# pull in early.
usvg = { version = "=0.45.1", default-features = false }
# Phase 10 Step 10.2 follow-up: the real fill/stroke tessellation backend,
# replacing this crate's own hand-rolled ear-clipping triangulator and
# stencil-and-cover fallback (Phase 3 Step 3.3.1/3.3.3). The industry-
# standard Rust 2D tessellation library (nical/lyon) -- a real sweep-line
# fill tessellator handling self-intersection, holes, and both winding
# rules correctly (ear-clipping could only ever handle a single simple
# contour, rejecting everything else), plus a real stroke tessellator
# (joins/caps/miter limit) this workspace never had at all. No default
# features needed: the base crate already re-exports `lyon_path`/
# `lyon_geom`/`lyon_tessellation` as modules; `extra`/`debugger`/
# `profiling`/`serialization` are opt-in features this crate doesn't use.
# Phase 13 Step 13.7: real SMIL <animate>/<animateTransform> parsing --
# `usvg` itself discards these elements entirely (a static-resolution
# parser by design, confirmed by reading its own source), so SMIL needs
# a separate, direct XML pass. Already a transitive dependency via
# `usvg` itself (confirmed in Cargo.lock, version 0.20.0) -- pinned here
# as a real, direct dependency now that this crate uses it itself.
roxmltree = "0.20.0"
lyon = "=1.0.19"
tre-engine = { path = "../tre-engine" }
# Reuses `Affine2::transform_point` (Phase 3 Step 3.1) to apply usvg's
# resolved per-path `abs_transform()` -- the field-for-field-equivalent
# affine formula, see `to_affine2` in src/lib.rs -- rather than
# reimplementing the same 2D affine math a second time.
tre-math = { path = "../tre-math" }

# Phase 9 Step 9.1: adversarial/malformed-input testing for parse_svg/
# triangulate (IMPLEMENTATION.md's own "fuzz-test... with malformed and
# adversarial documents" task). Real coverage-guided fuzzing via
# `cargo-fuzz` needs a nightly Rust toolchain, unavailable in this
# environment -- `proptest` is a well-established, stable-Rust-compatible
# property-testing crate that directly serves the same real intent
# (randomized/adversarial input generation, bounded-behavior assertions)
# without a new toolchain dependency. Disclosed as a deliberate
# substitution, not a silent scope reduction -- see REVIEW.md.
[dev-dependencies]
proptest = "1"
