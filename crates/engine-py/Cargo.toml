[package]
name = "engine-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PyO3 bindings -- the only crate depending on pyo3, and the only stability contract for framework users. See ARCHITECTURE.md §4, §8."

[lib]
# "rlib" (Cargo's default, needed for `cargo test -p engine-py` and for
# other crates in this workspace to depend on it as a normal Rust lib)
# plus "cdylib" (what maturin actually loads as the Python extension
# module) -- without "rlib" here, `cargo test`/`cargo build --workspace`
# would fail to link this crate as an ordinary dependency.
crate-type = ["cdylib", "rlib"]

[dependencies]
engine-core = { path = "../engine-core" }
engine-md3 = { path = "../engine-md3" }
engine-render = { path = "../engine-render" }
engine-platform = { path = "../engine-platform" }
engine-spec = { path = "../engine-spec" }
# "extension-module" is deliberately NOT enabled here -- see
# pyproject.toml's own comment. `cargo build`/`cargo test` build this
# crate without it (linkable standalone); maturin's actual wheel build
# passes `--features pyo3/extension-module` itself.
# "multiple-pymethods" (review follow-through, M28 Phase 2, §4/§8): lets
# `PyWindow`'s real `#[pymethods]` split across multiple files by
# responsibility (`window.rs` itself, `window_factory.rs`, `window_
# input.rs`, `window_docking.rs`, `window_virtual_canvas.rs`) instead of
# one ~1700-line block -- pyo3's own doc comment states its only real
# cost is `inventory`-based registration not supporting Wasm, which this
# desktop-only project (winit/wgpu throughout) never targets.
pyo3 = { version = "0.29.2", features = ["macros", "multiple-pymethods"] }
thiserror = "2.0.20"
# `App::run` builds and drives its own GPU/window state directly (§8's
# PyApp.run(), Design Principle 1's one blocking call) -- Rust doesn't
# re-export a dependency's own dependencies, so every crate named here
# is already a real dependency of engine-core/engine-render/
# engine-platform too; pinned at the exact same versions (confirmed via
# `grep -c 'name = "X"' Cargo.lock` staying at 1 for each after adding
# these -- no Linebender-family drift, §3).
peniko = "0.6.1"
taffy = "0.14.0"
wgpu = "29.0.3"
pollster = "1.0.1"
winit = "0.30.13"
vello_hybrid = { version = "0.2.0", features = ["wgpu", "wgpu_default", "text"] }
# M16 Phase 1 (§3, §9): `tracing` is already a real transitive
# dependency here (confirmed via `cargo tree -p engine-py -i tracing`
# -- pulled in by `winit`/`accesskit_unix`/`zbus`), so depending on it
# directly adds no new crate to the tree, only a name. `tracing-
# subscriber` is genuinely new -- an application-level crate no
# library dependency pulls in on its own, confirmed via the same
# `cargo tree` check finding zero hits for it before this.
tracing = "0.1.44"
# "env-filter" is not in tracing-subscriber's own default feature set
# (confirmed via direct read of its Cargo.toml) -- enabled explicitly
# so a real `RUST_LOG` env var can dial verbosity, matching §3's own
# "correlate with frame timing" framing (a developer needs to be able
# to turn the noise up/down, not get one fixed level forever).
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# M17 Phase 1 (§8): real clipboard text access -- `default-features =
# false` since this phase only needs `get_text`/`set_text` (confirmed
# real via direct source read), not `arboard`'s own default `image-
# data` feature (image clipboard support, unneeded here).
arboard = { version = "3.6.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# M30 Phase 9 Step 4 (§5, §8, §10): `Terminal`'s own real PTY/VT
# split -- the identical real "spawn a real pseudo-terminal is OS-
# specific process management; interpreting its byte stream is the
# VT/ANSI state machine every real terminal emulator implements
# identically -- neither is this widget's own concern to reinvent"
# reasoning the sibling `pyCopper` project's own real `Terminal`
# widget already established, verified directly rather than assumed
# to transfer. `portable-pty` (the wezterm project's own real,
# actively-maintained PTY-spawning crate) real-spawns a shell and
# gives a real byte-stream read/write handle; `vt100` (a small, real,
# widely-used pure-Rust VT100/ANSI parser -- feed it raw bytes, read
# back a real `Screen` cell grid) is the VT/ANSI half. POSIX only for
# this v1 (`portable-pty`'s own Windows/ConPTY backend exists but
# isn't exercised or verified here, the identical real "architected
# for, not built, since nothing here could verify it rather than
# guess" scope pyCopper's own real `Terminal` already chose).
portable-pty = "0.9.0"
vt100 = "0.16.2"
