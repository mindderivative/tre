[package]
name = "engine-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "winit EventLoop/ApplicationHandler and the accesskit_winit adapter. The only crate depending on winit. See ARCHITECTURE.md §4, §9."

[dependencies]
accesskit = "0.25.0"
accesskit_winit = "0.34.0"
engine-core = { path = "../engine-core" }
# M4 Phase 1 step 2: `engine_core::InputEvent`'s own `position` field is
# `peniko::kurbo::Point` -- needed for real now (translating a real
# `winit::dpi::PhysicalPosition` into it), not just in this crate's own
# tests as before. Already resolved at this exact version transitively
# (via `engine-core`), so this costs nothing new in the dependency graph.
peniko = "0.6.1"
winit = "0.30.13"

# M106 (issue #18): reads the OS's light/dark appearance from the XDG
# settings portal, which `winit` doesn't on Linux (`src/appearance.rs`).
# Already built here -- AccessKit's Linux backend (`accesskit_unix`)
# depends on it with these same `default-features = false` and
# `async-io`; `blocking-api` adds only the synchronous wrappers.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.5", default-features = false, features = ["async-io", "blocking-api"] }

# 0.5.0 M3 (issue #28): the system's double-click time, for double-clicking
# a framework-drawn title bar. Both are `winit`'s own dependencies at these
# versions, with these features already on, so nothing new is built.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_UI_Input_KeyboardAndMouse"] }

#
# 0.5.0 M4: macOS's overlay title bar, set live on the NSWindow, and the
# user's title-bar double-click setting. The same versions again, and
# winit's own features apart from Foundation's NSUserDefaults.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = [
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.2.2", features = ["NSGeometry", "NSString", "NSUserDefaults"] }

[dev-dependencies]
taffy = "0.14.0"

# Lives in tests/, not examples/, matching TRE v1's own precedent
# (archive/crates/tre-rhi-vulkan) exactly, same as engine-render's own
# rect_window.rs: winit permits constructing an EventLoop only on a
# process's real main thread and only once per process -- a plain
# #[test] fn runs on a worker thread and would panic. harness = false
# gives it its own process with a real main thread instead.
[[test]]
name = "access_button"
harness = false

[[test]]
name = "multi_window"
harness = false

[[test]]
name = "wake_event"
harness = false
