[package]
name = "engine-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "winit EventLoop/ApplicationHandler and the accesskit_winit adapter. The only crate depending on winit. See ARCHITECTURE.md §4, §9."

[dependencies]
accesskit = "0.25.0"
accesskit_winit = "0.34.0"
engine-core = { path = "../engine-core" }
# M4 Phase 1 step 2: `engine_core::InputEvent`'s own `position` field is
# `peniko::kurbo::Point` -- needed for real now (translating a real
# `winit::dpi::PhysicalPosition` into it), not just in this crate's own
# tests as before. Already resolved at this exact version transitively
# (via `engine-core`), so this costs nothing new in the dependency graph.
peniko = "0.6.1"
winit = "0.30.13"

[dev-dependencies]
taffy = "0.14.0"

# Lives in tests/, not examples/, matching TRE v1's own precedent
# (archive/crates/tre-rhi-vulkan) exactly, same as engine-render's own
# rect_window.rs: winit permits constructing an EventLoop only on a
# process's real main thread and only once per process -- a plain
# #[test] fn runs on a worker thread and would panic. harness = false
# gives it its own process with a real main thread instead.
[[test]]
name = "access_button"
harness = false

[[test]]
name = "multi_window"
harness = false

[[test]]
name = "wake_event"
harness = false
