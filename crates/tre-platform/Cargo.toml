[package]
name = "tre-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Phase 11 Step 11.1: windowing is now backed by `winit`, whose `Window`/
# `EventLoop` implement `raw-window-handle` 0.6's traits directly -- this
# crate no longer needs to construct `RawWindowHandle`/`RawDisplayHandle`
# by hand, so it no longer needs the `unsafe` carve-out TECHNICAL.md
# Section 9.1 previously granted it for that purpose.

[dependencies]
raw-window-handle = "0.6.2"
tre-engine = { path = "../tre-engine" }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# Real system clipboard access (GUI-readiness recommendation #4) -- the
# same small, self-contained, cross-platform crate the assessment named.
# `default-features = false` drops arboard's own `image-data` feature
# (a real, disclosed v1 scope: text only, matching this project's own
# "smallest real slice first" precedent elsewhere, e.g. usvg's identical
# `default-features = false`). Verified to build and round-trip real
# clipboard text against this machine's live Wayland session in complete
# isolation (a throwaway scratch crate outside this repository) before
# adding it here.
arboard = { version = "3", default-features = false }
# Native file dialogs (GUI-readiness recommendation #5) -- backed by the
# XDG desktop portal on Linux via `ashpd`. `xdg-portal` needs a real
# async runtime feature to build at all -- `async-std` (not `tokio`) is
# required: a `tokio` build LINKS fine but PANICS at runtime on every
# real call ("there is no reactor running, must be called from the
# context of a Tokio 1.x runtime"), because rfd's blocking API drives the
# portal's async calls itself via `pollster::block_on`, not a Tokio
# executor -- a real, disclosed gap between "links" and "actually works"
# only caught by calling the real blocking API in isolation, not just
# constructing the builder. Verified `async-std` builds, links, AND
# correctly blocks on a real portal file-chooser dialog (confirmed
# consistently across repeated runs) against this machine's live
# Wayland/KDE session in complete isolation (a throwaway scratch crate
# outside this repository) before adding it here.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
# System tray icon + native menu (GUI-readiness recommendation #5, tray
# half). `default-features = false` drops `libxdo` (`tray-icon`'s own
# default feature): an X11-only dependency used solely to make muda's
# *predefined* Copy/Cut/Paste/SelectAll menu items work, irrelevant here
# since a real caller already has `Clipboard` (Step 14.1) and builds
# regular `MenuItem`s, not predefined ones -- and this machine's real
# session is Wayland anyway. `tray-icon` re-exports all of `muda` under
# its own `menu` module, so `muda` is not a separate direct dependency.
# `gtk` is required directly (not just transitively): Linux requires a
# real GTK event loop pumped on the tray icon's own thread for it to
# register/respond at all (confirmed via `dbus-monitor` against this
# machine's real `org.kde.StatusNotifierWatcher`: a real
# `RegisterStatusNotifierItem` call and `StatusNotifierItemRegistered`
# signal were observed end to end in isolated feasibility testing,
# before adding any of this to the real workspace).
tray-icon = { version = "0.19", default-features = false }
gtk = "0.18"
