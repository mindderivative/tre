[package]
name = "tre-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Cannot combine `[lints] workspace = true` with additional overrides
# (Cargo rejects it), so the workspace-level lints are restated here
# alongside the extra `clippy::pedantic` this "core rendering crate"
# (TECHNICAL.md Section 9.2) opts into.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
# IMPLEMENTATION.md Step 5.1.2: `Canvas::draw_text` is this crate's
# first wiring into the text/atlas stack -- `tre-text` for shaped-glyph
# data and glyph outline extraction, `tre-atlas` for the shared dynamic
# texture atlas's lookup/request-insert API.
tre-atlas = { path = "../tre-atlas" }
tre-text = { path = "../tre-text" }
tre-math = { path = "../tre-math" }
tre-memory = { path = "../tre-memory" }
# Pinned to the exact same version `tre-text` uses (its own Cargo.toml
# comment: 0.46.2 needs a newer rustc) -- `draw_text` takes a caller-
# resolved `skrifa::FontRef` directly, so this crate needs the same
# type, not a re-export.
skrifa = "=0.33.2"
# Phase 12 Step 12.2: `FontRegistry::face` resolves a caller-loaded
# font's bytes into a real `rustybuzz::Face` for `tre_text::shape_text`
# to shape a `Text` primitive's own string against at flatten time --
# real, non-test code now, not just this crate's own tests, so this
# moved here from `[dev-dependencies]` below (which still pins the
# identical version -- kept as one declaration, not duplicated).
rustybuzz = "0.20.1"
# Phase 10 Step 10.2 follow-up: real fill (and stroke) tessellation for
# `Path`/`Polygon` shapes -- the industry-standard Rust 2D tessellation
# library (`nical/lyon`), same real reasoning as `tre-svg`'s own adoption
# (REVIEW.md). `tre-engine` cannot depend on `tre-svg` to reach ITS
# tessellation code (`tre-svg` already depends on `tre-engine`, for
# `UiVertex` -- a dependency cycle), so this crate depends on lyon
# directly instead; no bridge crate needed, since neither crate reaches
# into the other's tessellation code anymore. `#![forbid(unsafe_code)]`
# is unaffected: that lint only governs code written in this crate, not
# its dependencies' own internals.
lyon = "=1.0.19"

[dev-dependencies]
# Phase 9 Step 9.2: TECHNICAL.md Section 9.2's own "cargo bench via
# criterion, verifying the <=0.50ms CPU frame processing budget" gate,
# never previously built (no criterion dependency, no benches/ anywhere
# in this workspace before this step). Minimal real gate, not the full
# per-demo benchmark suite Section 9.2 itself separately owns.
criterion = "0.5"

[[bench]]
name = "frame_processing"
harness = false
