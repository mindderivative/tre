[package]
name = "tre-math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Cannot combine `[lints] workspace = true` with additional overrides
# (Cargo rejects it), so the workspace-level lints are restated here
# alongside the extra `clippy::pedantic` this "core rendering crate"
# (TECHNICAL.md Section 9.2) opts into.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
