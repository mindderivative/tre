[package]
name = "engine-md3"
version.workspace = true
edition.workspace = true
description = "Material Design 3 theming: color scheme, shadow/ripple helpers, shape morph, motion-curve presets. Depends on engine-core, never the reverse. See ARCHITECTURE.md §4, §7."

[dependencies]
engine-core = { path = "../engine-core" }
# §7.4's shape-morph module needs `kurbo::BezPath`/`Point`/`PathEl` --
# via `peniko::kurbo`'s re-export, matching every other crate's own
# "go through peniko, don't depend on kurbo directly" convention.
# Already resolved at 0.6.1 elsewhere in the workspace.
peniko = "0.6.1"
