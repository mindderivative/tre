[package]
name = "engine-md3"
version.workspace = true
edition.workspace = true
description = "Material Design 3 theming: dynamic color science (HCT/tonal palettes/scheme roles). Depends on engine-core, never the reverse. See ARCHITECTURE.md §4, §7.1. (shape_morph/motion-curve presets moved to engine-core at M7 Phase 1/4 -- neither had real MD3-specific content.)"

[dependencies]
engine-core = { path = "../engine-core" }
material-colors = "0.4.2"
# `color.rs` maps every resolved scheme role onto `peniko::Color` --
# already resolved at 0.6.1 elsewhere in the workspace.
peniko = "0.6.1"
